name: Inspect code

on:
  workflow_dispatch:
    inputs:
      lines:
        description: "Доп. диапазон строк ProfileActivity, например 9000-9060 (можно пусто)"
        required: false
        default: ""
      pattern:
        description: "Доп. поиск по regex в ProfileActivity (можно пусто)"
        required: false
        default: ""

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Show code
        env:
          LINES: ${{ inputs.lines }}
          PATTERN: ${{ inputs.pattern }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java
          echo "===== A. rows for other users/chats (8636-8700) ====="
          awk 'NR>=8636 && NR<=8700 {print NR": "$0}' "$F"
          echo "===== B. all lines with usernameRow ====="
          grep -n "usernameRow" "$F"
          echo "===== C. all lines with languageRow ====="
          grep -n "languageRow" "$F"
          echo "===== D. context of 'position == usernameRow' and 'position == languageRow' ====="
          grep -nE -B2 -A12 "position == (usernameRow|languageRow)" "$F" | head -150
          echo "===== E. string API ====="
          grep -nE "LocaleController\.getString\(" "$F" | head -3
          grep -nE "LocaleController\.getString\(" TMessagesProj/src/main/java/org/telegram/ui/NotificationsSettingsActivity.java | head -3
          if [ -n "$LINES" ]; then
            S=${LINES%-*}; E=${LINES#*-}
            echo "===== EXTRA lines $LINES ====="
            awk -v s="$S" -v e="$E" 'NR>=s && NR<=e {print NR": "$0}' "$F"
          fi
          if [ -n "$PATTERN" ]; then
            echo "===== EXTRA grep $PATTERN ====="
            grep -nE -B2 -A8 "$PATTERN" "$F" | head -150
          fi
