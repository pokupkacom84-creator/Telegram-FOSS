                              "dialogCheckboxSquareBackground", "progressCircle", "featuredStickers_addButton",
                              "chat_messagePanelSend", "chat_messagePanelCursor", "chat_inReplyLine", "chat_inReplyNameText",
                              "chat_inSiteNameText", "chat_messageLinkIn", "chat_fieldOverlayText", "actionBarTabLine",
                              "actionBarTabActiveText");
                      put(m, onPrimary, "chats_unreadCounterText", "featuredStickers_buttonText", "checkboxCheck");

                      // кнопка «Новый чат» (FAB) — primary container
                      put(m, pc, "chats_actionBackground", "chats_actionPressedBackground");
                      put(m, onPc, "chats_actionIcon");

                      // пузыри сообщений
                      put(m, pc, "chat_outBubble", "chat_outBubbleGradient", "chat_outBubbleGradient2", "chat_outBubbleGradient3");
                      put(m, pcSel, "chat_outBubbleSelected");
                      put(m, onPc, "chat_messageTextOut", "chat_messageLinkOut", "chat_outReplyNameText", "chat_outSiteNameText",
                              "chat_outForwardedNameText", "chat_outViaBotNameText", "chat_outAudioTitleText", "chat_outFileNameText");
                      put(m, onPcVar, "chat_outTimeText", "chat_outViews", "chat_outSentCheck", "chat_outSentCheckRead",
                              "chat_outSentCheckSelected", "chat_outSentCheckReadSelected", "chat_outReplyLine",
                              "chat_outReplyMessageText", "chat_outAudioPerfomerText", "chat_outAudioPerformerText",
                              "chat_outFileInfoText", "chat_outLoader", "chat_outMenu", "chat_outInstant");
                      put(m, surfHigh, "chat_inBubble");
                      put(m, surfSel, "chat_inBubbleSelected");
                  }
                  colors = m;
                  builtTheme = theme;
                  builtFor = dark ? 2 : 1;
              }
          }
          '''
          open(J + "messenger/FluxMaterialYou.java", "w", encoding="utf-8").write(java)
          print("FluxMaterialYou.java written")

          # 1. хук в Theme.getColor: подменяем цвета на динамические
          soft("theme-hook", "ui/ActionBar/Theme.java",
               r"public static int getColor\(int key, boolean\[\] isDefault, boolean ignoreAnimation\) \{",
               lambda m: m.group(0) + "\n        Integer fluxM3 = org.telegram.messenger.FluxMaterialYou.override(key);"
               "\n        if (fluxM3 != null) {\n            if (isDefault != null) {\n                isDefault[0] = false;\n            }"
               "\n            return fluxM3;\n        }")

          # 2. M3-скругления: радиус пузырей по умолчанию 22 (у M3 крупные скругления)
          soft("bubble-radius", "messenger/SharedConfig.java",
               r'(getInt\("bubbleRadius",\s*)\d+(\))',
               lambda m: m.group(1) + "22" + m.group(2), count=1)
          soft("bubble-radius-default", "messenger/SharedConfig.java",
               r"public static int bubbleRadius = \d+;",
               lambda m: "public static int bubbleRadius = 22;")

          # 3. переключатель в FluxGram -> Внешний вид
          soft("settings-toggle", "ui/FluxSettingsActivity.java",
               r'addInfo\(list, context, "Изменения применяются при следующем открытии чата\."\);',
               lambda m: 'addToggle(list, context, "Material You: цвета из обоев", org.telegram.messenger.FluxMaterialYou.KEY, '
               'org.telegram.messenger.FluxMaterialYou.pref(), false, false);\n'
               '                  addInfo(list, context, "Палитра Material 3 из ваших обоев (Android 12+). Применяется после перезапуска FluxGram.");\n'
               '                  ' + m.group(0))
          PY

      - name: Android SDK licenses and packages
        run: |
          set +o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1"
          NDK=$(grep -rhoE 'ndkVersion[ =]+"[0-9.]+"' --include=build.gradle . | head -1 | grep -oE '[0-9.]+' | head -1)
          [ -n "$NDK" ] && "$SDKM" "ndk;$NDK" || true

      - name: Create API_KEYS
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          printf 'APP_ID = %s\nAPP_HASH = %s\n' "${APP_ID:-12345}" "${APP_HASH:-aaaaaaaabbbbbbccccccfffffff001122}" > API_KEYS

      - name: Build native libraries (libvpx, ffmpeg, boringssl)
        run: |
          export NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | head -1)
          export NINJA_PATH=$(which ninja)
          cd TMessagesProj/jni
          chmod +x *.sh
          ./build_libvpx_clang.sh
          ./build_ffmpeg_clang.sh
          ./patch_ffmpeg.sh
          ./patch_boringssl.sh
          ./build_boringssl.sh

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FluxGram-apk
          path: "**/build/outputs/apk/**/*.apk"
