      - name: Заголовок «Telegram» → FluxGram (код + языковой пакет)
        if: ${{ env.REBRAND != 'false' }}
        run: |
          python3 - <<'PY'
          import re, glob, os

          NAME = os.environ["APP_NAME"]

          # Заголовок списка чатов берётся из языкового пакета с сервера (ключ AppName = "Telegram"),
          # поэтому подменяем сами вызовы на строку с названием приложения.
          call = re.compile(
              r'(?:LocaleController\s*\.\s*)?getString\(\s*'
              r'(?:"(?:AppName|ApplicationName|AppNameBeta)"\s*,\s*)?'
              r'R\.string\.(?:AppName|ApplicationName|AppNameBeta)\s*\)')
          lit = re.compile(r'(setTitle\(\s*)"Telegram(?: Beta)?"')

          total = 0
          for f in glob.glob("TMessagesProj/src/main/java/**/*.java", recursive=True):
              s = open(f, encoding="utf-8").read()
              n, c1 = call.subn('"' + NAME + '"', s)
              n, c2 = lit.subn(lambda m: m.group(1) + '"' + NAME + '"', n)
              if c1 + c2:
                  open(f, "w", encoding="utf-8").write(n)
                  total += c1 + c2
                  print("  %s: %d" % (f.split("/")[-1], c1 + c2))
          print("Подменено заголовков в коде:", total)
          PY

      - name: Режим шпиона (SpyMode + хук в MessagesController)
        run: |
          python3 - <<'PY'
          import re, os, sys

          tg = "TMessagesProj/src/main/java/org/telegram/tgnet"
          tlrpc = open(tg + "/TLRPC.java", encoding="utf-8").read()

          import glob
          SRC = {"TLRPC": tlrpc}
          for _f in glob.glob(tg + "/tl/*.java"):
              SRC[os.path.basename(_f)[:-5]] = open(_f, encoding="utf-8").read()
          Q = {}
          def has(name, only=None):
              for holder, text in SRC.items():
                  if only and holder != only:
                      continue
                  if re.search(r'class\s+' + name + r'\b', text):
                      Q[name] = ("TLRPC." if holder == "TLRPC" else "org.telegram.tgnet.tl." + holder + ".") + name
                      print("  найден    " + Q[name])
                      return True
              print("  НЕ найден " + name)
              return False

          cases = []
          if has("TL_updateDeleteMessages"):
              cases.append('if (u instanceof org.telegram.tgnet.tl.TL_update.TL_updateDeleteMessages) { if (keepDeleted) { recordDeleted(0, ((org.telegram.tgnet.tl.TL_update.TL_updateDeleteMessages) u).messages); updates.remove(i--); } continue; }')
          if has("TL_updateDeleteChannelMessages"):
              cases.append('if (u instanceof org.telegram.tgnet.tl.TL_update.TL_updateDeleteChannelMessages) { org.telegram.tgnet.tl.TL_update.TL_updateDeleteChannelMessages d = (org.telegram.tgnet.tl.TL_update.TL_updateDeleteChannelMessages) u; long did = -(long) d.channel_id; if (keepDeleted && !isException(did)) { recordDeleted(did, d.messages); updates.remove(i--); } continue; }')
          if has("TL_updateEditMessage"):
              cases.append('if (u instanceof org.telegram.tgnet.tl.TL_update.TL_updateEditMessage) { if (keepEdits) { recordEdit(((org.telegram.tgnet.tl.TL_update.TL_updateEditMessage) u).message); } continue; }')
          if has("TL_updateEditChannelMessage"):
              cases.append('if (u instanceof org.telegram.tgnet.tl.TL_update.TL_updateEditChannelMessage) { if (keepEdits) { recordEdit(((org.telegram.tgnet.tl.TL_update.TL_updateEditChannelMessage) u).message); } continue; }')

          status_impl = "private static void recordOnline(long userId, Object status) { }"
          if has("TL_updateUserStatus") and has("TL_userStatusOffline"):
              cases.append('if (u instanceof org.telegram.tgnet.tl.TL_update.TL_updateUserStatus) { if (keepOnline) { recordOnline(((org.telegram.tgnet.tl.TL_update.TL_updateUserStatus) u).user_id, ((org.telegram.tgnet.tl.TL_update.TL_updateUserStatus) u).status); } continue; }')
              status_impl = """private static void recordOnline(long userId, Object status) {
                  try {
                      long ts = System.currentTimeMillis() / 1000;
                      if (status instanceof TLRPC.TL_userStatusOffline) {
                          try {
                              java.lang.reflect.Field f;
                              try { f = status.getClass().getField("was_online"); }
                              catch (NoSuchFieldException e) { f = status.getClass().getField("wasOnline"); }
                              long wo = ((Number) f.get(status)).longValue();
                              if (wo > 0) ts = wo;
                          } catch (Throwable ignore) { }
                      }
                      ContentValues v = new ContentValues();
                      v.put("user_id", userId);
                      v.put("ts", ts);
                      db().insertWithOnConflict("online", null, v, SQLiteDatabase.CONFLICT_REPLACE);
                  } catch (Throwable ignore) { }
              }"""

          java = """package org.telegram.messenger;

          import android.content.ContentValues;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.database.sqlite.SQLiteDatabase;
          import android.database.sqlite.SQLiteOpenHelper;

          import org.telegram.tgnet.TLRPC;
          import org.telegram.ui.ActionBar.AlertDialog;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Comparator;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          public class SpyMode {
              public static final String KEY_DELETED = "spy_deleted";
              public static final String KEY_EDITS = "spy_edits";
              public static final String KEY_ATTACH = "spy_attach";
              public static final String KEY_READ_DATE = "spy_read_date";
              public static final String KEY_LAST_ONLINE = "spy_last_online";
              public static final String KEY_LIMIT = "spy_limit_index";
              public static final String KEY_FOLDER = "spy_folder";
              public static final String KEY_EXCEPTIONS = "spy_exceptions";

              public static final String[] LIMIT_TITLES = {"300 MB", "1 GB", "2 GB", "5 GB", "16 GB", "∞"};
              private static final long MB = 1024L * 1024L;
              private static final long[] LIMITS = {300L * MB, 1024L * MB, 2048L * MB, 5120L * MB, 16384L * MB, -1L};

              private static SQLiteOpenHelper helper;

              private static SharedPreferences prefs() {
                  Context c = ApplicationLoader.applicationContext;
                  return c == null ? null : c.getSharedPreferences("spymode", Context.MODE_PRIVATE);
              }

              public static boolean get(String key) {
                  SharedPreferences p = prefs();
                  return p == null || p.getBoolean(key, true);
              }

              public static void set(String key, boolean value) {
                  SharedPreferences p = prefs();
                  if (p != null) {
                      p.edit().putBoolean(key, value).apply();
                  }
              }

              public static int getLimit() {
                  SharedPreferences p = prefs();
                  return p == null ? LIMITS.length - 1 : p.getInt(KEY_LIMIT, LIMITS.length - 1);
              }

              public static void setLimit(int index) {
                  SharedPreferences p = prefs();
                  if (p != null) {
                      p.edit().putInt(KEY_LIMIT, index).apply();
                  }
                  trim();
              }

              public static String folderName() {
                  SharedPreferences p = prefs();
                  return p == null ? "Saved Attachments" : p.getString(KEY_FOLDER, "Saved Attachments");
              }

              public static void setFolderName(String name) {
                  SharedPreferences p = prefs();
                  if (p != null && name != null && name.trim().length() > 0) {
                      p.edit().putString(KEY_FOLDER, name.trim().replace("/", "_")).apply();
                  }
              }

              public static File attachmentsDir() {
                  Context c = ApplicationLoader.applicationContext;
                  File base = c.getExternalFilesDir(null);
                  if (base == null) {
                      base = c.getFilesDir();
                  }
                  File d = new File(base, folderName());
                  if (!d.exists()) {
                      d.mkdirs();
                  }
                  return d;
              }

              private static long size(File f) {
                  if (f == null || !f.exists()) return 0;
                  if (f.isFile()) return f.length();
                  long total = 0;
                  File[] list = f.listFiles();
                  if (list != null) {
                      for (File x : list) {
                          total += size(x);
                      }
                  }
                  return total;
              }

              public static long usedBytes() {
                  return size(attachmentsDir());
              }

              /** удаляет самые старые вложения, если превышен выбранный лимит */
              public static void trim() {
                  try {
                      int idx = getLimit();
                      if (idx < 0 || idx >= LIMITS.length || LIMITS[idx] < 0) return;
                      File[] files = attachmentsDir().listFiles();
                      if (files == null) return;
                      Arrays.sort(files, new Comparator<File>() {
                          @Override
                          public int compare(File a, File b) {
                              return Long.compare(a.lastModified(), b.lastModified());
                          }
                      });
                      long total = usedBytes();
                      for (File f : files) {
                          if (total <= LIMITS[idx]) break;
                          long len = size(f);
                          if (deleteRec(f)) {
                              total -= len;
                          }
                      }
                  } catch (Throwable ignore) { }
              }

              private static boolean deleteRec(File f) {
                  File[] list = f.listFiles();
                  if (list != null) {
                      for (File x : list) {
                          deleteRec(x);
                      }
                  }
                  return f.delete();
              }

              // ---- исключения (ID диалогов) ----
              public static Set<String> getExceptions() {
                  SharedPreferences p = prefs();
                  Set<String> s = p == null ? null : p.getStringSet(KEY_EXCEPTIONS, null);
                  return s == null ? new HashSet<String>() : new HashSet<String>(s);
              }

              public static boolean isException(long dialogId) {
                  return getExceptions().contains(String.valueOf(dialogId));
              }

              /** true — добавлен, false — убран */
              public static boolean toggleException(long dialogId) {
                  Set<String> s = getExceptions();
                  String k = String.valueOf(dialogId);
                  boolean added = !s.remove(k);
                  if (added) {
                      s.add(k);
                  }
                  SharedPreferences p = prefs();
                  if (p != null) {
                      p.edit().putStringSet(KEY_EXCEPTIONS, s).apply();
                  }
                  return added;
              }

              // ---- база данных ----
              private static synchronized SQLiteDatabase db() {
                  if (helper == null) {
                      helper = new SQLiteOpenHelper(ApplicationLoader.applicationContext, "spy.db", null, 1) {
                          @Override
                          public void onCreate(SQLiteDatabase d) {
                              d.execSQL("CREATE TABLE IF NOT EXISTS deleted(dialog_id INTEGER, msg_id INTEGER, date INTEGER, PRIMARY KEY(dialog_id, msg_id))");
                              d.execSQL("CREATE TABLE IF NOT EXISTS edits(dialog_id INTEGER, msg_id INTEGER, date INTEGER, text TEXT)");
                              d.execSQL("CREATE TABLE IF NOT EXISTS online(user_id INTEGER PRIMARY KEY, ts INTEGER)");
                          }

                          @Override
                          public void onUpgrade(SQLiteDatabase d, int o, int n) { }
                      };
                  }
                  return helper.getWritableDatabase();
              }

              private static File dbFile() {
                  return ApplicationLoader.applicationContext.getDatabasePath("spy.db");
              }

              public static synchronized void exportTo(OutputStream os) throws Exception {
                  db();
                  helper.close();
                  helper = null;
                  InputStream in = new FileInputStream(dbFile());
                  try {
                      byte[] buf = new byte[16384];
                      int r;
                      while ((r = in.read(buf)) > 0) {
                          os.write(buf, 0, r);
                      }
                  } finally {
                      in.close();
                      os.close();
                  }
              }

              public static synchronized void importFrom(InputStream in) throws Exception {
                  if (helper != null) {
                      helper.close();
                      helper = null;
                  }
                  DELETED.clear();
                  deletedLoaded = false;
                  File f = dbFile();
                  f.getParentFile().mkdirs();
                  OutputStream os = new FileOutputStream(f);
                  try {
                      byte[] buf = new byte[16384];
                      int r;
                      while ((r = in.read(buf)) > 0) {
                          os.write(buf, 0, r);
                      }
                  } finally {
                      os.close();
                      in.close();
                  }
              }

              public static synchronized void clear() {
                  try {
                      SQLiteDatabase d = db();
                      d.delete("deleted", null, null);
                      d.delete("edits", null, null);
                      d.delete("online", null, null);
                      DELETED.clear();
                  } catch (Throwable ignore) { }
                  deleteRecContents(attachmentsDir());
              }

              private static void deleteRecContents(File dir) {
                  File[] list = dir.listFiles();
                  if (list != null) {
                      for (File x : list) {
                          deleteRec(x);
                      }
                  }
              }

              public static long lastOnline(long userId) {
                  try {
                      android.database.Cursor c = db().rawQuery("SELECT ts FROM online WHERE user_id = ?", new String[]{String.valueOf(userId)});
                      try {
                          return c.moveToFirst() ? c.getLong(0) : 0;
                      } finally {
                          c.close();
                      }
                  } catch (Throwable e) {
                      return 0;
                  }
              }

              private static final Set<String> DELETED = java.util.Collections.synchronizedSet(new HashSet<String>());
              private static boolean deletedLoaded;

              private static synchronized void loadDeleted() {
                  if (deletedLoaded) return;
                  try {
                      android.database.Cursor c = db().rawQuery("SELECT dialog_id, msg_id FROM deleted", null);
                      try {
                          while (c.moveToNext()) {
                              DELETED.add(c.getLong(0) + "_" + c.getLong(1));
                          }
                      } finally {
                          c.close();
                      }
                      deletedLoaded = true;
                  } catch (Throwable ignore) { }
              }

              private static long keyDialog(MessageObject mo) {
                  return mo.messageOwner.peer_id instanceof TLRPC.TL_peerChannel ? mo.getDialogId() : 0;
              }

              public static boolean isDeleted(MessageObject mo) {
                  try {
                      if (mo == null || mo.messageOwner == null) return false;
                      loadDeleted();
                      return DELETED.contains(keyDialog(mo) + "_" + mo.getId());
                  } catch (Throwable e) {
                      return false;
                  }
              }

              /** добавляет пометку к времени сообщения, если оно было удалено */
              public static String decorateTime(MessageObject mo, String time) {
                  if (isDeleted(mo)) {
                      return "🗑 удалено" + (time == null || time.length() == 0 ? "" : ", " + time);
                  }
                  return time;
              }

              public static boolean hasEdits(MessageObject mo) {
                  try {
                      if (mo == null) return false;
                      android.database.Cursor c = db().rawQuery("SELECT COUNT(*) FROM edits WHERE dialog_id = ? AND msg_id = ?",
                              new String[]{String.valueOf(mo.getDialogId()), String.valueOf(mo.getId())});
                      try {
                          return c.moveToFirst() && c.getInt(0) > 0;
                      } finally {
                          c.close();
                      }
                  } catch (Throwable e) {
                      return false;
                  }
              }

              public static AlertDialog editsDialog(Context context, MessageObject mo) {
                  StringBuilder sb = new StringBuilder();
                  try {
                      android.database.Cursor c = db().rawQuery("SELECT date, text FROM edits WHERE dialog_id = ? AND msg_id = ? ORDER BY date ASC",
                              new String[]{String.valueOf(mo.getDialogId()), String.valueOf(mo.getId())});
                      try {
                          String nl = System.lineSeparator();
                          while (c.moveToNext()) {
                              long date = c.getLong(0);
                              sb.append(LocaleController.formatSmallDateChat(date)).append(", ")
                                      .append(LocaleController.getInstance().getFormatterDay().format(date * 1000L)).append(nl)
                                      .append(c.getString(1) == null ? "" : c.getString(1)).append(nl).append(nl);
                          }
                      } finally {
                          c.close();
                      }
                  } catch (Throwable ignore) { }
                  AlertDialog.Builder b = new AlertDialog.Builder(context);
                  b.setTitle("История правок");
                  b.setMessage(sb.length() == 0 ? "Нет сохранённых правок" : sb.toString().trim());
                  b.setPositiveButton("OK", null);
                  return b.create();
              }

              /** копирует скачанное вложение сообщения в папку шпиона */
              public static void saveAttachment(final File src, Object parent) {
                  try {
                      if (src == null || !get(KEY_ATTACH) || !(parent instanceof MessageObject)) return;
                      final MessageObject mo = (MessageObject) parent;
                      if (mo.isSticker() || mo.isAnimatedSticker()) return;
                      if (isException(mo.getDialogId())) return;
                      final String name = mo.getDialogId() + "_" + mo.getId() + "_" + src.getName();
                      Utilities.globalQueue.postRunnable(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  if (!src.exists() || src.length() == 0) return;
                                  File dst = new File(attachmentsDir(), name);
                                  if (dst.exists()) return;
                                  InputStream in = new FileInputStream(src);
                                  OutputStream os = new FileOutputStream(dst);
                                  try {
                                      byte[] buf = new byte[65536];
                                      int r;
                                      while ((r = in.read(buf)) > 0) {
                                          os.write(buf, 0, r);
                                      }
                                  } finally {
                                      in.close();
                                      os.close();
                                  }
                                  trim();
                              } catch (Throwable ignore) { }
                          }
                      });
                  } catch (Throwable ignore) { }
              }

              private static void recordDeleted(long did, List<Integer> ids) {
                  if (ids == null) return;
                  try {
                      SQLiteDatabase d = db();
                      long now = System.currentTimeMillis() / 1000;
                      for (int k = 0; k < ids.size(); k++) {
                          ContentValues v = new ContentValues();
                          v.put("dialog_id", did);
                          v.put("msg_id", ids.get(k));
                          v.put("date", now);
                          d.insertWithOnConflict("deleted", null, v, SQLiteDatabase.CONFLICT_IGNORE);
                          DELETED.add(did + "_" + ids.get(k));
                      }
                  } catch (Throwable ignore) { }
              }

