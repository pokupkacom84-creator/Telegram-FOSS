                      ImageDraw.Draw(mask).ellipse((0, 0, w - 1, h - 1), fill=255)
                      img.putalpha(mask)
              img.save(f, "WEBP" if f.endswith(".webp") else "PNG")
              n += 1

          print("иконок заменено:", n)
          if n == 0:
              print("::warning::mipmap-иконки не найдены, иконка не заменена")
