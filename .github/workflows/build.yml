                  badge.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          boolean on = !FluxBadge.enabled();
                          FluxBadge.setEnabled(on);
                          badge.setChecked(on);
                      }
                  });
                  list.addView(badge, matchWrap());

                  final TextCheckCell parts = newCell();
                  parts.setTextAndCheck("Частицы вокруг значка", FluxBadgeDrawable.particlesEnabled(context), false);
                  parts.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          boolean on = !FluxBadgeDrawable.particlesEnabled(context);
                          FluxBadgeDrawable.setParticlesEnabled(context, on);
                          parts.setChecked(on);
                          if (badgePreview != null) {
                              badgePreview.invalidate();
                          }
                      }
                  });
                  list.addView(parts, matchWrap());

                  badgePreview = new BadgePreview(context);
                  list.addView(badgePreview, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, AndroidUtilities.dp(92)));
                  addNote("Значок видят другие пользователи FluxGram. Он появляется у них не сразу: приложение проверяет профили по одному в секунду. Частицы выключаются сразу, без перезапуска.");

                  updateUi(true);
              }

              private void choose(int hue, int sat) {
                  FluxFeatures.setSeed(ctx, hue, sat);
                  rebuildStack();
                  updateUi(true);
              }

              private void updateUi(boolean setBars) {
                  int hue = FluxFeatures.seedHue(ctx);
                  int sat = FluxFeatures.seedSat(ctx);
                  if (hue >= 0) {
                      if (setBars) {
                          hueBar.setProgress(hue);
                          satBar.setProgress(sat);
                      }
                      hueLabel.setText("Оттенок: " + hue + "°");
                  } else {
                      if (setBars) {
                          hueBar.setProgress(205);
                          satBar.setProgress(48);
                      }
                      hueLabel.setText("Оттенок: системный (обои)");
                  }
                  for (Swatch sw : swatches) {
                      sw.invalidate();
                  }
                  preview.invalidate();
                  styleDice();
              }

              private void styleDice() {
                  if (dice == null) {
                      return;
                  }
                  boolean dark = FluxFeatures.isDark(ctx);
                  GradientDrawable g = new GradientDrawable();
                  g.setCornerRadius(AndroidUtilities.dp(26));
                  g.setColor(FluxFeatures.preview(ctx, Role.PRIMARY_CONTAINER, dark));
                  dice.setBackground(g);
                  dice.setTextColor(FluxFeatures.preview(ctx, Role.ON_PRIMARY_CONTAINER, dark));
              }

              private LinearLayout.LayoutParams matchWrap() {
                  return new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
              }

              private TextCheckCell newCell() {
                  TextCheckCell cell = new TextCheckCell(ctx);
                  cell.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
                  return cell;
              }

              private void addHeader(String title) {
                  HeaderCell header = new HeaderCell(ctx);
                  header.setText(title);
                  header.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
                  list.addView(header, matchWrap());
              }

              private void addNote(String text) {
                  TextView note = new TextView(ctx);
                  note.setText(text);
                  note.setTextSize(14);
                  note.setTextColor(Theme.getColor(Theme.key_windowBackgroundWhiteGrayText4));
                  note.setPadding(AndroidUtilities.dp(21), AndroidUtilities.dp(10), AndroidUtilities.dp(21), AndroidUtilities.dp(16));
                  list.addView(note, matchWrap());
              }

              // Круг-образец палитры с кольцом выбранного
              private class Swatch extends View {
                  private final int hue;
                  private final int sat;
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                  Swatch(Context c, int hue, int sat) {
                      super(c);
                      this.hue = hue;
                      this.sat = sat;
                  }

                  private int color(Role r) {
                      boolean dark = FluxFeatures.isDark(getContext());
                      if (hue < 0) {
                          return Build.VERSION.SDK_INT >= 31 ? FluxFeatures.systemColor(getContext(), r, dark) : 0xFF888888;
                      }
                      return FluxFeatures.paletteColor(r, dark, hue, sat / 100f);
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      float cx = getWidth() / 2f;
                      float cy = getHeight() / 2f;
                      float r = Math.min(cx, cy) - AndroidUtilities.dp(4);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(color(Role.PRIMARY_CONTAINER));
                      canvas.drawCircle(cx, cy, r, p);
                      p.setColor(color(Role.PRIMARY));
                      canvas.drawArc(new RectF(cx - r, cy - r, cx + r, cy + r), -90, 180, true, p);
                      p.setColor(color(Role.TERTIARY));
                      canvas.drawCircle(cx, cy, r * 0.35f, p);
                      boolean sel = FluxFeatures.seedHue(getContext()) == hue && (hue < 0 || FluxFeatures.seedSat(getContext()) == sat);
                      if (sel) {
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(AndroidUtilities.dp(3));
                          p.setColor(Theme.getColor(Theme.key_windowBackgroundWhiteBlackText));
                          canvas.drawCircle(cx, cy, r + AndroidUtilities.dp(2), p);
                      }
                  }
              }

              // Два значка: пользователя FluxGram и официального канала. Показывают, как выглядят частицы
              private class BadgePreview extends View {
                  private final FluxBadgeDrawable userBadge;
                  private final FluxBadgeDrawable officialBadge;
                  private final Paint tp = new Paint(Paint.ANTI_ALIAS_FLAG);

                  BadgePreview(Context c) {
                      super(c);
                      userBadge = new FluxBadgeDrawable(c, true, false);
                      officialBadge = new FluxBadgeDrawable(c, true, true);
                      setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
                      tp.setTextSize(AndroidUtilities.dp(12));
                      tp.setTextAlign(Paint.Align.CENTER);
                  }

                  private void drawBadge(Canvas canvas, FluxBadgeDrawable d, float cx, float cy, String label) {
                      float scale = 2.2f;
                      float side = d.getIntrinsicWidth() * scale;
                      canvas.save();
                      canvas.translate(cx - side / 2f, cy - side / 2f);
                      canvas.scale(scale, scale);
                      d.draw(canvas);
                      canvas.restore();
                      tp.setColor(Theme.getColor(Theme.key_windowBackgroundWhiteGrayText4));
                      canvas.drawText(label, cx, cy + side / 2f + AndroidUtilities.dp(14), tp);
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      float h = getHeight() * 0.42f;
                      drawBadge(canvas, userBadge, getWidth() * 0.27f, h, "Пользователь FluxGram");
                      drawBadge(canvas, officialBadge, getWidth() * 0.73f, h, "Официальный канал");
                      if (FluxBadgeDrawable.particlesEnabled(getContext())) {
                          postInvalidateOnAnimation();
                      }
                  }
              }

              // Две мини-панели: светлая и тёмная версия чата в выбранной палитре
              private class PreviewView extends View {
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final RectF rf = new RectF();

                  PreviewView(Context c) {
                      super(c);
                  }

                  private int col(Role r, boolean dark) {
                      return FluxFeatures.preview(getContext(), r, dark);
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      int pad = AndroidUtilities.dp(14);
                      int gap = AndroidUtilities.dp(12);
                      int w = (getWidth() - pad * 2 - gap) / 2;
                      int h = getHeight() - AndroidUtilities.dp(16);
                      drawPanel(canvas, pad, AndroidUtilities.dp(8), w, h, false);
                      drawPanel(canvas, pad + w + gap, AndroidUtilities.dp(8), w, h, true);
                  }

                  private void box(Canvas c, float l, float t, float r, float b, float rad, int color) {
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(color);
                      rf.set(l, t, r, b);
                      c.drawRoundRect(rf, rad, rad, p);
                  }

                  private void drawPanel(Canvas c, int x, int y, int w, int h, boolean dark) {
                      int d = AndroidUtilities.dp(1);
                      box(c, x, y, x + w, y + h, AndroidUtilities.dp(24), col(Role.SURFACE, dark));
                      // верхняя панель
                      box(c, x + d * 10, y + d * 10, x + w - d * 10, y + d * 34, d * 12, col(Role.SURFACE_CONTAINER, dark));
                      box(c, x + d * 18, y + d * 18, x + d * 70, y + d * 26, d * 4, col(Role.ON_SURFACE, dark));
                      // входящее сообщение
                      box(c, x + d * 10, y + d * 44, x + w * 0.72f, y + d * 78, d * 14, col(Role.SURFACE_CONTAINER_HIGH, dark));
                      box(c, x + d * 20, y + d * 56, x + w * 0.5f, y + d * 62, d * 3, col(Role.ON_SURFACE_VARIANT, dark));
                      // исходящее
                      box(c, x + w * 0.28f, y + d * 86, x + w - d * 10, y + d * 120, d * 14, col(Role.PRIMARY_CONTAINER, dark));
                      box(c, x + w * 0.4f, y + d * 98, x + w * 0.82f, y + d * 104, d * 3, col(Role.ON_PRIMARY_CONTAINER, dark));
                      // чипы
                      box(c, x + d * 10, y + d * 130, x + d * 56, y + d * 148, d * 9, col(Role.SECONDARY_CONTAINER, dark));
                      box(c, x + d * 62, y + d * 130, x + d * 100, y + d * 148, d * 9, col(Role.TERTIARY_CONTAINER, dark));
                      // FAB
                      float fb = y + h - d * 12;
                      box(c, x + w - d * 56, fb - d * 44, x + w - d * 12, fb, d * 14, col(Role.PRIMARY_CONTAINER, dark));
                      box(c, x + w - d * 42, fb - d * 30, x + w - d * 26, fb - d * 14, d * 4, col(Role.ON_PRIMARY_CONTAINER, dark));
                      // поле ввода
                      box(c, x + d * 10, fb - d * 36, x + w - d * 68, fb, d * 18, col(Role.SURFACE_VARIANT, dark));
                  }
              }
          }
          JAVA

          if [ "$MATERIAL_YOU" = "true" ]; then MY=true; else MY=false; fi
          sed -i "s/FLUX_MY_DEFAULT/$MY/" "$D/FluxFeatures.java"
          if [ "$BADGE_PARTICLES" = "false" ]; then PT=false; else PT=true; fi
          sed -i "s/FLUX_PARTICLES_DEFAULT/$PT/" "$D/FluxBadgeDrawable.java"
          echo "FluxBadge, FluxBadgeDrawable, FluxFeatures созданы (Material You: $MY, частицы: $PT)"

      - name: FluxGram - патчи (профиль, чат, официальный канал, пункт «Темы FluxGram»)
        run: |
          python3 - <<'PY'
          import re, os

          def read(p):
              try:
                  return open(p, encoding="utf-8").read()
              except FileNotFoundError:
                  print("::warning::нет файла " + p)
                  return ""

          def write(p, s):
              if s:
                  open(p, "w", encoding="utf-8").write(s)

          def add_import(s):
              if "import org.telegram.messenger.FluxBadge;" in s:
                  return s
              return re.sub(r'(?m)^(package [^\n]+;\n)', r'\1\nimport org.telegram.messenger.FluxBadge;\n', s, count=1)

          report = []
          def ok(m): print(m); report.append("OK   " + m)
          def warn(m): print("::warning::" + m); report.append("FAIL " + m)

          SRC = "TMessagesProj/src/main/java/org/telegram/"
          CTX = "org.telegram.messenger.ApplicationLoader.applicationContext"

          # 1. Material You: перехват цветов
          p = SRC + "ui/ActionBar/Theme.java"
          s = read(p)
          sig = "private static int getColorFromTable(SparseIntArray currentColors, int key, boolean[] isDefault) {\n"
          sig2 = "public static int getColor(int key, boolean[] isDefault, boolean ignoreAnimation) {\n"
          hook = ("        Integer fluxColor = org.telegram.messenger.FluxFeatures.override(key);\n"
                  "        if (fluxColor != null) {\n"
                  "            return fluxColor;\n"
                  "        }\n")
          # Явные роли M3 идут через override(), все остальные ключи (сотни) через tint():
          # исходный цвет темы Telegram перекрашивается в палитру Material You
          wrap1 = (sig +
                   "        if (currentColors != Theme.currentColors) {\n"
                   "            return getColorFromTableFluxOrig(currentColors, key, isDefault);\n"
                   "        }\n" + hook +
                   "        return org.telegram.messenger.FluxFeatures.tint(key, getColorFromTableFluxOrig(currentColors, key, isDefault));\n"
                   "    }\n\n"
                   "    private static int getColorFromTableFluxOrig(SparseIntArray currentColors, int key, boolean[] isDefault) {\n")
          wrap2 = (sig2 + hook +
                   "        return org.telegram.messenger.FluxFeatures.tint(key, getColorFluxOrig(key, isDefault, ignoreAnimation));\n"
                   "    }\n\n"
                   "    private static int getColorFluxOrig(int key, boolean[] isDefault, boolean ignoreAnimation) {\n")
          if "FluxFeatures.override" in s:
              ok("Theme: уже пропатчен")
          elif s.count(sig) == 1:
              s = s.replace(sig, wrap1, 1)
              write(p, s)
              ok("Theme: Material You на все ключи темы (getColorFromTable: роли + автоперекраска)")
          elif s.count(sig2) == 1:
              s = s.replace(sig2, wrap2, 1)
              write(p, s)
              ok("Theme: Material You на все ключи темы (getColor, запасной якорь: роли + автоперекраска)")
          else:
              warn("Theme.java: не найден ни getColorFromTable, ни getColor, цвета Material You не подключены")

          # 2. Списки пользователей
          p = SRC + "ui/Cells/UserCell.java"
          if os.path.exists(p):
              s = read(p)
              pat = re.compile(r'(?m)^(\s*)nameTextView\.setText\(name\);\n')
              if "FluxBadge" in s:
                  ok("UserCell: уже пропатчен")
              elif len(pat.findall(s)) != 2:
                  warn("UserCell.java: якоря не найдены, значок в списках пользователей не подключён")
              else:
                  s = pat.sub(lambda m: m.group(1) + "name = FluxBadge.wrapUser(getContext(), name, currentUser);\n" + m.group(0), s)
                  write(p, add_import(s))
                  ok("UserCell: значок в списках пользователей")

          # 3. Профиль: пользователь (значок с частицами) и канал (значок официального канала)
          p = SRC + "ui/ProfileActivity.java"
          s = read(p)
          if "FluxBadge" in s:
              ok("ProfileActivity: уже пропатчен")
          else:
              pat_u = re.compile(r'(\} else if \(user\.verified\) \{\s*nameTextView\.setRightDrawable2\(getVerifiedCrossfadeDrawable\(\)\);\s*'
                                 r'nameTextViewRightDrawable2ContentDescription = [^;]+;\s*)\} else \{(\s*nameTextView\.setRightDrawable2\(null\);)')
              s, n1 = pat_u.subn(lambda m: m.group(1) +
                  "} else if (FluxBadge.isFluxUser(user.id, userInfo != null ? userInfo.about : null)) {\n"
                  "                    nameTextView.setRightDrawable2(FluxBadge.drawableAnimated(getContext()));\n"
                  "                    nameTextViewRightDrawable2ContentDescription = \"FluxGram\";\n"
                  "                } else {" + m.group(2), s, count=1)
              pat_c = re.compile(r'\} else if \(chat\.verified\) \{(\s*nameTextView\.setRightDrawable2\(getVerifiedCrossfadeDrawable\(\)\);)')
              s, n2 = pat_c.subn(lambda m:
                  "} else if (FluxBadge.isOfficialChannel(chat)) {\n"
                  "                    nameTextView.setRightDrawable2(FluxBadge.officialDrawable(getContext()));\n"
                  "                    nameTextViewRightDrawable2ContentDescription = \"Официальный канал FluxGram\";\n"
                  "                } else if (chat.verified) {" + m.group(1), s, count=1)
              if n1 or n2:
                  write(p, add_import(s))
              if n1:
                  ok("ProfileActivity: значок пользователя FluxGram")
              else:
                  warn("ProfileActivity: якорь пользователя не найден")
              if n2:
                  ok("ProfileActivity: значок официального канала")
              else:
                  warn("ProfileActivity: якорь канала не найден")

          # 4. Шапка чата: пользователь и официальный канал
          p = SRC + "ui/ChatActivity.java"
          s = read(p)
          if "FluxBadge" in s:
              ok("ChatActivity: уже пропатчен")
          else:
              pat_u = re.compile(r'avatarContainer\.setTitle\((AndroidUtilities\.removeRTL\(AndroidUtilities\.removeDiacritics\(UserObject\.getUserName\((currentUser|user)\)\)\))')
              s, n1 = pat_u.subn(lambda m: "avatarContainer.setTitle(FluxBadge.wrapUser(" + CTX + ", " + m.group(1) + ", " + m.group(2) + ")", s)
              pat_c = re.compile(r'avatarContainer\.setTitle\((AndroidUtilities\.removeRTL\(AndroidUtilities\.removeDiacritics\(currentChat\.title\)\)), currentChat\.scam, currentChat\.fake, currentChat\.verified,')
              s, n2 = pat_c.subn(lambda m: "avatarContainer.setTitle(FluxBadge.wrapChat(" + CTX + ", " + m.group(1) + ", currentChat), currentChat.scam, currentChat.fake, currentChat.verified && !FluxBadge.isOfficialChannel(currentChat),", s)
              if n1 or n2:
                  write(p, add_import(s))
              if n1:
                  ok("ChatActivity: значок в шапке личного чата (мест: %d)" % n1)
              else:
                  warn("ChatActivity: якорь шапки пользователя не найден")
              if n2:
                  ok("ChatActivity: значок официального канала в шапке (мест: %d)" % n2)
              else:
                  warn("ChatActivity: якорь шапки канала не найден")

          # 5. Официальный канал: настоящая «галочка» во всех списках
          p = SRC + "messenger/MessagesController.java"
          s = read(p)
          pat = re.compile(r'(public void putChat\(\s*(?:final )?TLRPC\.Chat chat,\s*boolean fromCache\)\s*\{\n)')
          if "isOfficialChannel" in s:
              ok("MessagesController: уже пропатчен")
          elif len(pat.findall(s)) != 1:
              warn("MessagesController.java: putChat не найден, «галочка» официального канала в списках чатов не подключена")
          else:
              s = pat.sub(lambda m: m.group(1) + "        if (chat != null && FluxBadge.isOfficialChannel(chat)) {\n            chat.verified = true;\n        }\n", s, count=1)
              write(p, s)
              ok("MessagesController: «галочка» официального канала в списках чатов")

          # 6. Настройки: пункт «Темы FluxGram». id берём свободный, чтобы не конфликтовать с другими пунктами
          p = SRC + "ui/SettingsActivity.java"
          s = read(p)
          if "FluxThemesActivity" in s:
              ok("SettingsActivity: уже пропатчен")
          else:
              used = set(int(x) for x in re.findall(r'Factory\.of\((\d+),', s)) | set(int(x) for x in re.findall(r'case (\d+):', s))
              new_id = max(used | {0}) + 1
              m = re.search(r'\n([ \t]*)items\.add\(SettingCell\.Factory\.of\(28,[^\n]*\);', s)
              mc = re.search(r'\n([ \t]*)case 24:', s)
              if not m or not mc:
                  warn("SettingsActivity.java: нет пункта id 28 или case 24, раздел «Темы FluxGram» не добавлен")
              else:
                  ind = m.group(1)
                  item = ('\n' + ind + 'items.add(SettingCell.Factory.of(%d, 0xFF2FC6A8, 0xFF1D9E86, R.drawable.settings_fluxgram_themes, "Темы FluxGram"));' % new_id)
                  s = s[:m.end()] + item + s[m.end():]
                  mc = re.search(r'\n([ \t]*)case 24:', s)
                  ind2 = mc.group(1)
                  click = ('\n' + ind2 + 'case %d: {' % new_id + '\n' + ind2 + '    presentFragment(new FluxThemesActivity());' +
                           '\n' + ind2 + '    break;' + '\n' + ind2 + '}')
                  s = s[:mc.start()] + click + s[mc.start():]
                  write(p, s)
                  ok("SettingsActivity: пункт «Темы FluxGram» (id %d)" % new_id)

          # 7. Автозапуск: фоновая проверка «О себе» у людей из списков и метка в своём профиле стартуют вместе с приложением
          p = SRC + "messenger/ApplicationLoader.java"
          s = read(p)
          pat = re.compile(r'(public void onCreate\(\)\s*\{\n)')
          if "FluxBadge.init" in s:
              ok("ApplicationLoader: автозапуск уже подключён")
          elif len(pat.findall(s)) != 1:
              warn("ApplicationLoader.java: onCreate не найден, проверка запустится только при открытии профилей и списков")
          else:
              hook = ("        new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(new Runnable() {\n"
                      "            @Override\n"
                      "            public void run() {\n"
                      "                try {\n"
                      "                    FluxBadge.init(UserConfig.selectedAccount);\n"
                      "                } catch (Throwable t) {\n"
                      "                    FileLog.e(t);\n"
                      "                }\n"
                      "            }\n"
                      "        }, 6000);\n")
              s = pat.sub(lambda m: m.group(1) + hook, s, count=1)
              write(p, s)
              ok("ApplicationLoader: автозапуск проверки значков")

          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as f:
              f.write("## Патчи FluxGram (значок, официальный канал, темы)\n```\n" + "\n".join(report) + "\n```\n")
          PY

      - name: Нативные библиотеки (libvpx, ffmpeg, boringssl)
        working-directory: TMessagesProj/jni
        run: |
          set -o pipefail
          export NDK="$ANDROID_HOME/ndk/$NDK_VER"
          export ANDROID_NDK_HOME="$NDK"
          export NINJA_PATH="$(command -v ninja)"
          echo "NDK=$NDK"
          run_script() {
            if [ ! -f "$1" ]; then echo "SKIP (нет файла): $1"; return 0; fi
            echo ">>> $1"
            chmod +x "$1"
            "./$1"
          }
          {
            run_script build_libvpx_clang.sh
            run_script build_ffmpeg_clang.sh
            run_script patch_ffmpeg.sh
            run_script patch_boringssl.sh
            run_script build_boringssl.sh
          } 2>&1 | tee "$GITHUB_WORKSPACE/native.log"

      - name: Build APK
        run: |
          set -o pipefail
          chmod +x gradlew
          EXTRA=""
          if [ "$REBRAND" != "false" ] && [ -f rebrand.init.gradle ]; then
            EXTRA="-I rebrand.init.gradle"
          fi
          if [ -n "$ABI" ] && [ "$ABI" != "all" ]; then
            EXTRA="$EXTRA -Pandroid.injected.build.abi=$ABI"
          fi
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --console=plain --max-workers=4 $EXTRA \
            -PRELEASE_STORE_PASSWORD="$KS_STORE_PASS" \
            -PRELEASE_KEY_ALIAS="$KS_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KS_KEY_PASS" \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            2>&1 | tee build.log

      - name: Краткая причина ошибки (если сборка упала)
        if: failure()
        run: |
          {
            echo "## Причина падения"
            for f in build.log native.log; do
              [ -f "$f" ] || continue
              echo "### $f"
              echo '```'
              awk '/\* What went wrong:/{p=1} p{print} /\* Try:/{p=0}' "$f" | head -40
              grep -nE "error:|Error:|fatal error|FAILED|No matching client|OutOfMemory|Could not|ninja: build stopped|cannot find symbol" "$f" | grep -v "^[0-9]*:\s*at " | head -40
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Найти готовые APK
        run: |
          mkdir -p out
          echo "=== все .apk / .aab в проекте ==="
          find . -type f \( -name '*.apk' -o -name '*.aab' \) -not -path './.git/*' -not -path './out/*' | tee all_pkgs.txt
          echo "================================="
          # приоритет: outputs/apk, затем intermediates/apk, затем любые *.apk приложения
          grep -E 'TMessagesProj_App/build/outputs/apk/.*\.apk$' all_pkgs.txt > apk_list.txt || true
          [ -s apk_list.txt ] || grep -E 'TMessagesProj_App/build/intermediates/apk/.*\.apk$' all_pkgs.txt > apk_list.txt || true
          [ -s apk_list.txt ] || grep -E 'TMessagesProj_App/.*\.apk$' all_pkgs.txt > apk_list.txt || true
          [ -s apk_list.txt ] || grep -E '\.apk$' all_pkgs.txt > apk_list.txt || true
          while read -r f; do
            cp "$f" "out/$(basename "$(dirname "$f")")_$(basename "$f")"
          done < apk_list.txt
          ls -lh out
          if [ -z "$(ls -A out)" ]; then
            echo "::error::APK не найдены"
            ls -R TMessagesProj_App/build/intermediates 2>/dev/null | grep -iE "apk|package" | head -50
            exit 1
          fi

      - name: Zipalign + подпись APK (v1+v2+v3) и проверка
        run: |
          set -e
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          BT="${BT%/}"
          echo "build-tools: $BT"
          KS="$GITHUB_WORKSPACE/TMessagesProj/config/release.keystore"
          mkdir -p signed
          for f in out/*.apk; do
            n="$(basename "$f" .apk)"
            "$BT/zipalign" -p -f 4 "$f" "signed/$n-aligned.apk"
            "$BT/apksigner" sign \
              --ks "$KS" --ks-key-alias "$KS_ALIAS" \
              --ks-pass "pass:$KS_STORE_PASS" --key-pass "pass:$KS_KEY_PASS" \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "signed/$n.apk" "signed/$n-aligned.apk"
            rm -f "signed/$n-aligned.apk" "signed/$n.apk.idsig"
            "$BT/zipalign" -c -P 16 4 "signed/$n.apk" && echo "aligned OK: $n" || "$BT/zipalign" -c 4 "signed/$n.apk"
            "$BT/apksigner" verify -v --print-certs "signed/$n.apk" | head -12
            "$BT/aapt2" dump badging "signed/$n.apk" | grep -E "^package:|sdkVersion|targetSdk|native-code" || true
          done
          ls -lh signed

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: signed/*.apk
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            native.log
          if-no-files-found: ignore

  # Пробная установка в эмулятор Android 16: показывает настоящую причину,
  # если APK не ставится. Работает только когда в APK есть x86_64 (abi = all или x86_64).
  install-test:
    needs: build
    if: ${{ inputs.abi == 'all' || inputs.abi == 'x86_64' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Скачать APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Скрипт проверки
        run: |
          cat > install_test.sh <<'SH'
          adb logcat -c
          for f in apk/*.apk; do echo "=== $f" | tee -a install.log; adb install -r "$f" 2>&1 | tee -a install.log; done
          adb logcat -d | grep -iE "PackageManager|PackageInstaller|installd|INSTALL_" | tail -150 >> install.log
          adb shell pm list packages | grep -i fluxgram | tee -a install.log || true
          SH
          chmod +x install_test.sh

      - name: Установка в эмулятор Android 16
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./install_test.sh

      - name: Результат установки
        if: always()
        run: cat install.log || echo "install.log не создан"

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-test
          path: install.log
          if-no-files-found: ignore

  # Публикация собранного APK в GitHub Releases.
  # Приложение может проверять обновления через https://api.github.com/repos/<owner>/<repo>/releases/latest
  release:
    needs: build
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Скачать APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Создать GitHub Release и прикрепить APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NO: ${{ github.run_number }}
        run: |
          TAG="fluxgram-v1.0.${RUN_NO}"
          NOTES="Сборка FluxGram #${RUN_NO} (commit ${GITHUB_SHA::7}). Файлы: $(ls apk | tr '\n' ' ')"
          gh release create "$TAG" apk/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "FluxGram ${TAG}" \
            --notes "$NOTES" \
            --latest
