          java = r'''package org.telegram.messenger;

          import android.content.ContentValues;
          import android.content.Context;
          import android.database.Cursor;
          import android.database.sqlite.SQLiteDatabase;
          import android.database.sqlite.SQLiteOpenHelper;

          import androidx.collection.LongSparseArray;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.HashSet;
          import java.util.Locale;

          import org.telegram.tgnet.TLRPC;
          import org.telegram.ui.ActionBar.AlertDialog;

          public class FluxStore extends SQLiteOpenHelper {

              private static FluxStore instance;

              private final HashSet<String> deleted = new HashSet<>();
              private final HashSet<String> edited = new HashSet<>();
              private boolean loaded;

              private static synchronized FluxStore get() {
                  if (instance == null) {
                      instance = new FluxStore(ApplicationLoader.applicationContext);
                  }
                  return instance;
              }

              private FluxStore(Context context) {
                  super(context, "fluxgram_store.db", null, 1);
              }

              @Override
              public void onCreate(SQLiteDatabase db) {
                  db.execSQL("CREATE TABLE IF NOT EXISTS deleted(acc INTEGER, did INTEGER, mid INTEGER, PRIMARY KEY(acc, did, mid))");
                  db.execSQL("CREATE TABLE IF NOT EXISTS edits(acc INTEGER, did INTEGER, mid INTEGER, edit_date INTEGER, text TEXT)");
              }

              @Override
              public void onUpgrade(SQLiteDatabase db, int oldVersion, int newVersion) {
              }

              private static String key(int acc, long did, int mid) {
                  return acc + ":" + did + ":" + mid;
              }

              private static long dialogKey(TLRPC.Message m) {
                  if (m != null && m.peer_id != null && m.peer_id.channel_id != 0) {
                      return -m.peer_id.channel_id;
                  }
                  return 0;
              }

              private synchronized void ensureLoaded() {
                  if (loaded) {
                      return;
                  }
                  loaded = true;
                  try {
                      SQLiteDatabase db = getReadableDatabase();
                      Cursor c = db.rawQuery("SELECT acc, did, mid FROM deleted", null);
                      while (c.moveToNext()) {
                          deleted.add(key(c.getInt(0), c.getLong(1), c.getInt(2)));
                      }
                      c.close();
                      c = db.rawQuery("SELECT DISTINCT acc, did, mid FROM edits", null);
                      while (c.moveToNext()) {
                          edited.add(key(c.getInt(0), c.getLong(1), c.getInt(2)));
                      }
                      c.close();
                  } catch (Throwable t) {
                      FileLog.e(t);
                  }
              }

              // ---------- удалённые сообщения ----------

              public static void markDeleted(final int acc, LongSparseArray<ArrayList<Integer>> map) {
                  if (map == null) {
                      return;
                  }
                  final FluxStore s = get();
                  s.ensureLoaded();
                  final ArrayList<long[]> rows = new ArrayList<>();
                  for (int a = 0; a < map.size(); a++) {
                      long did = map.keyAt(a);
                      ArrayList<Integer> ids = map.valueAt(a);
                      if (ids == null) {
                          continue;
                      }
                      for (int b = 0; b < ids.size(); b++) {
                          int mid = ids.get(b);
                          if (mid <= 0) {
                              continue;
                          }
                          rows.add(new long[]{did, mid});
                          synchronized (s) {
                              s.deleted.add(key(acc, did, mid));
                          }
                      }
                  }
                  Utilities.globalQueue.postRunnable(() -> {
                      try {
                          SQLiteDatabase db = s.getWritableDatabase();
                          db.beginTransaction();
                          try {
                              for (int i = 0; i < rows.size(); i++) {
                                  ContentValues v = new ContentValues();
                                  v.put("acc", acc);
                                  v.put("did", rows.get(i)[0]);
                                  v.put("mid", rows.get(i)[1]);
                                  db.insertWithOnConflict("deleted", null, v, SQLiteDatabase.CONFLICT_IGNORE);
                              }
                              db.setTransactionSuccessful();
                          } finally {
                              db.endTransaction();
                          }
                      } catch (Throwable t) {
                          FileLog.e(t);
                      }
                  });
              }

              public static boolean isDeleted(MessageObject obj) {
                  if (obj == null || obj.messageOwner == null || obj.getId() <= 0) {
                      return false;
                  }
                  FluxStore s = get();
                  s.ensureLoaded();
                  synchronized (s) {
                      return s.deleted.contains(key(obj.currentAccount, dialogKey(obj.messageOwner), obj.getId()));
                  }
              }

              // ---------- история правок ----------

              public static void recordEdit(final int acc, TLRPC.Message oldMsg, TLRPC.Message newMsg) {
                  if (oldMsg == null || newMsg == null || oldMsg.message == null || oldMsg.message.equals(newMsg.message)) {
                      return;
                  }
                  final FluxStore s = get();
                  s.ensureLoaded();
                  final long did = dialogKey(newMsg);
                  final int mid = newMsg.id;
                  final int date = oldMsg.edit_date != 0 ? oldMsg.edit_date : oldMsg.date;
                  final String text = oldMsg.message;
                  synchronized (s) {
                      s.edited.add(key(acc, did, mid));
                  }
                  Utilities.globalQueue.postRunnable(() -> {
                      try {
                          ContentValues v = new ContentValues();
                          v.put("acc", acc);
                          v.put("did", did);
                          v.put("mid", mid);
                          v.put("edit_date", date);
                          v.put("text", text);
                          s.getWritableDatabase().insert("edits", null, v);
                      } catch (Throwable t) {
                          FileLog.e(t);
                      }
                  });
              }

              public static boolean hasEdits(MessageObject obj) {
                  if (obj == null || obj.messageOwner == null || obj.getId() <= 0) {
                      return false;
                  }
                  FluxStore s = get();
                  s.ensureLoaded();
                  synchronized (s) {
                      return s.edited.contains(key(obj.currentAccount, dialogKey(obj.messageOwner), obj.getId()));
                  }
              }

              public static void showEditHistory(Context context, MessageObject obj) {
                  if (context == null || obj == null) {
                      return;
                  }
                  StringBuilder sb = new StringBuilder();
                  SimpleDateFormat fmt = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());
                  try {
                      Cursor c = get().getReadableDatabase().rawQuery(
                              "SELECT edit_date, text FROM edits WHERE acc = ? AND did = ? AND mid = ? ORDER BY rowid DESC",
                              new String[]{String.valueOf(obj.currentAccount), String.valueOf(dialogKey(obj.messageOwner)), String.valueOf(obj.getId())});
                      sb.append("Сейчас:\n").append(obj.messageOwner.message == null ? "" : obj.messageOwner.message);
                      while (c.moveToNext()) {
                          sb.append("\n\n").append(fmt.format(new Date(c.getLong(0) * 1000L))).append(":\n").append(c.getString(1));
                      }
                      c.close();
                  } catch (Throwable t) {
                      FileLog.e(t);
                  }
                  AlertDialog.Builder builder = new AlertDialog.Builder(context);
                  builder.setTitle("История правок");
                  builder.setMessage(sb.toString());
                  builder.setPositiveButton("OK", null);
                  builder.show();
              }
          }
          '''
