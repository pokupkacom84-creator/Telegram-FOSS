                      public void draw(Canvas canvas) {
                          bg.setColor(0xFFB06BFF);
                          float r = size / 2f;
                          canvas.drawCircle(r, r, r, bg);
                          tp.setColor(0xFFFFFFFF);
                          tp.setTextSize(size * 0.52f);
                          tp.setTextAlign(Paint.Align.CENTER);
                          canvas.drawText(label, r, r - (tp.ascent() + tp.descent()) / 2f, tp);
