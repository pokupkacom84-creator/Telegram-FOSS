              "classic": Image.open(io.BytesIO(base64.b64decode(CLASSIC))).convert("RGBA"),
              "ocean": Image.open(io.BytesIO(base64.b64decode(OCEAN))).convert("RGBA"),
          }
          # в Telegram: Классика = Vintage, Океан = Aqua
          KEYS = {"classic": "VINTAGE", "ocean": "AQUA"}
          FALLBACK = {"classic": "vintage", "ocean": "aqua"}

          def rounded(img, size, circle=False):
              big = Image.new("L", (size[0] * 4, size[1] * 4), 0)
              d = ImageDraw.Draw(big)
              if circle:
                  d.ellipse((0, 0, big.width - 1, big.height - 1), fill=255)
              else:
                  d.rounded_rectangle((0, 0, big.width - 1, big.height - 1), radius=int(min(size) * 0.27) * 4, fill=255)
              out = img.resize(size, Image.LANCZOS)
              out.putalpha(big.resize(size, Image.LANCZOS))
              return out

          def opaque(img, size):
              bg = Image.new("RGBA", img.size, (0, 0, 0, 255))
              bg.alpha_composite(img)
              return bg.resize(size, Image.LANCZOS)

          ctl = glob.glob("TMessagesProj/src/main/java/**/LauncherIconController.java", recursive=True)
          ctl_src = open(ctl[0], encoding="utf-8").read() if ctl else ""
          if not ctl:
              print("::warning::LauncherIconController.java не найден, ищу ресурсы по имени")

          def res_names(key):
              m = re.search(r'\b' + KEYS[key] + r'\s*\(([^;]*?)\)\s*[,;]', ctl_src, re.S)
              names = re.findall(r'R\.(?:mipmap|drawable)\.(\w+)', m.group(1)) if m else []
              return names

          total = 0
          for key, img in SRC.items():
              names = res_names(key)
              files = []
              if names:
                  print(key, "-> ресурсы из LauncherIconController:", names)
                  for n in names:
                      for ext in ("png", "webp"):
                          files += glob.glob("TMessagesProj*/src/main/res/**/%s.%s" % (n, ext), recursive=True)
              if not files:
                  print("::warning::%s: ресурсы из enum не найдены, ищу по имени *%s*" % (key, FALLBACK[key]))
                  for ext in ("png", "webp"):
                      files += glob.glob("TMessagesProj*/src/main/res/**/*%s*.%s" % (FALLBACK[key], ext), recursive=True)
              files = [f for f in files if "/build/" not in f and "anydpi" not in f and "monochrome" not in os.path.basename(f).lower()]
              if not files:
                  print("::warning::%s: ни одного файла не заменено" % key)
              for f in sorted(set(files)):
                  size = Image.open(f).size
                  low = os.path.basename(f).lower()
                  if "foreground" in low or "background" in low:
                      out = opaque(img, size)
                  else:
                      out = rounded(img, size, circle=("round" in low))
                  out.save(f, "WEBP" if f.endswith(".webp") else "PNG")
                  total += 1
                  print("  заменено:", f, size)
          print("всего файлов заменено:", total)

          # значок FluxGram рядом с ником
          os.makedirs("TMessagesProj/src/main/res/drawable-nodpi", exist_ok=True)
          rounded(SRC["ocean"], (96, 96)).save("TMessagesProj/src/main/res/drawable-nodpi/flux_badge.webp", "WEBP")
          print("flux_badge.webp создан")
          PY

      - name: FluxGram - Java-классы (значок, официальный канал, Material You, экран тем)
        env:
          MATERIAL_YOU: ${{ inputs.material_you }}
          BADGE_PARTICLES: ${{ inputs.badge_particles }}
        run: |
          set -e
          D=TMessagesProj/src/main/java/org/telegram/messenger
          mkdir -p "$D"

          cat > "$D/FluxBadgeDrawable.java" <<'JAVA'
          package org.telegram.messenger;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.ColorFilter;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.drawable.Drawable;
          import android.os.SystemClock;

          // Значок FluxGram с частицами. official = значок официального канала (синяя «галочка» и золотые искры)
          public class FluxBadgeDrawable extends Drawable {

              private static final int N = 9;
              private static final int[] COLORS = {0xFF7FD6FF, 0xFFFFFFFF, 0xFFB388FF, 0xFF8CF0D0};
              private static final int[] COLORS_OFFICIAL = {0xFFFFD54F, 0xFFFFFFFF, 0xFF7FD6FF, 0xFFFFB74D};

              // Состояние частиц общее для всех значков: переключатель в настройках действует сразу, без перезапуска
              private static volatile int particlesState = -1;

              private final Context appCtx;
              private final Drawable icon;
              private final boolean animated;
              private final boolean official;
              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Path star = new Path();
              private final Path check = new Path();
              private final int size;
              private int alpha = 255;

              public static boolean particlesEnabled(Context ctx) {
                  int st = particlesState;
                  if (st < 0) {
                      boolean v = ctx.getSharedPreferences("fluxgram_prefs", Context.MODE_PRIVATE)
                              .getBoolean("flux_particles", FLUX_PARTICLES_DEFAULT);
                      particlesState = v ? 1 : 0;
                      return v;
                  }
                  return st == 1;
              }

              public static void setParticlesEnabled(Context ctx, boolean on) {
                  particlesState = on ? 1 : 0;
                  ctx.getSharedPreferences("fluxgram_prefs", Context.MODE_PRIVATE).edit().putBoolean("flux_particles", on).apply();
              }

              public FluxBadgeDrawable(Context ctx, boolean animated, boolean official) {
                  Context app = ctx.getApplicationContext();
                  this.appCtx = app != null ? app : ctx;
                  this.icon = ctx.getResources().getDrawable(R.drawable.flux_badge).mutate();
                  this.animated = animated;
                  this.official = official;
                  this.size = AndroidUtilities.dp(22);
                  setBounds(0, 0, size, size);
              }

              @Override
              public void draw(Canvas canvas) {
                  boolean particles = particlesEnabled(appCtx);
                  Rect b = getBounds();
                  float cx = b.exactCenterX();
                  float cy = b.exactCenterY();
                  float s = Math.min(b.width(), b.height());
                  int half = (int) (s * 0.32f);
                  icon.setBounds((int) cx - half, (int) cy - half, (int) cx + half, (int) cy + half);
                  icon.draw(canvas);
                  if (particles) {
                      drawParticles(canvas, cx, cy, s);
                  }
                  if (official) {
                      drawCheck(canvas, cx + half * 0.85f, cy + half * 0.85f, s * 0.17f);
                  }
                  if (animated && particles) {
                      invalidateSelf();
                  }
              }

              private void drawParticles(Canvas canvas, float cx, float cy, float s) {
                  int[] colors = official ? COLORS_OFFICIAL : COLORS;
                  float t = animated ? (SystemClock.uptimeMillis() % 7000L) / 7000f : 0.2f;
                  for (int i = 0; i < N; i++) {
                      float dir = (i % 2 == 0) ? 1f : -1f;
                      float angle = (float) (2 * Math.PI * (i / (float) N + t * dir * (0.7f + 0.15f * (i % 3))));
                      float pulse = (float) Math.sin(2 * Math.PI * (t * 2f + i / (float) N));
                      float r = s * (0.40f + 0.06f * pulse);
                      float px = cx + (float) Math.cos(angle) * r;
                      float py = cy + (float) Math.sin(angle) * r;
                      float tw = 0.35f + 0.65f * Math.abs(pulse);
                      paint.setStyle(Paint.Style.FILL);
                      paint.setColor(colors[i % colors.length]);
                      paint.setAlpha((int) (alpha * tw));
                      float pr = AndroidUtilities.dpf2(0.7f + 0.5f * (i % 3)) * (0.7f + 0.5f * tw);
                      if (i % 3 == 0) {
                          drawStar(canvas, px, py, pr * 2.2f);
                      } else {
                          canvas.drawCircle(px, py, pr, paint);
                      }
                  }
              }

              private void drawCheck(Canvas c, float x, float y, float r) {
                  paint.setStyle(Paint.Style.FILL);
                  paint.setColor(0xFF2AABEE);
                  paint.setAlpha(alpha);
                  c.drawCircle(x, y, r, paint);
                  check.reset();
                  check.moveTo(x - r * 0.45f, y);
                  check.lineTo(x - r * 0.1f, y + r * 0.38f);
                  check.lineTo(x + r * 0.5f, y - r * 0.35f);
                  paint.setStyle(Paint.Style.STROKE);
                  paint.setStrokeCap(Paint.Cap.ROUND);
                  paint.setStrokeJoin(Paint.Join.ROUND);
                  paint.setStrokeWidth(Math.max(1f, r * 0.28f));
                  paint.setColor(0xFFFFFFFF);
                  paint.setAlpha(alpha);
                  c.drawPath(check, paint);
                  paint.setStyle(Paint.Style.FILL);
              }

              private void drawStar(Canvas c, float x, float y, float r) {
                  star.reset();
                  star.moveTo(x, y - r);
                  star.quadTo(x, y, x + r, y);
                  star.quadTo(x, y, x, y + r);
                  star.quadTo(x, y, x - r, y);
                  star.quadTo(x, y, x, y - r);
                  star.close();
                  c.drawPath(star, paint);
              }

              @Override public int getIntrinsicWidth() { return size; }
              @Override public int getIntrinsicHeight() { return size; }
              @Override public void setAlpha(int a) { alpha = a; icon.setAlpha(a); }
              @Override public void setColorFilter(ColorFilter cf) { }
              @Override public int getOpacity() { return PixelFormat.TRANSLUCENT; }
          }
          JAVA

          cat > "$D/FluxBadge.java" <<'JAVA'
          package org.telegram.messenger;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.drawable.Drawable;
          import android.text.SpannableStringBuilder;
          import android.text.Spanned;
          import android.text.style.ImageSpan;
          import android.widget.Toast;

          import org.telegram.tgnet.ConnectionsManager;
          import org.telegram.tgnet.RequestDelegate;
          import org.telegram.tgnet.TLObject;
          import org.telegram.tgnet.TLRPC;

          import java.lang.reflect.Field;
          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;

          public final class FluxBadge implements NotificationCenter.NotificationCenterDelegate {

              // Невидимая метка в конце «О себе»: так друг друга находят пользователи FluxGram
              public static final String MARK = "⁠​⁠";
              public static final String OFFICIAL_CHANNEL = "FluxGraam";

              private static final String PREFS = "fluxgram_prefs";
              private static final String KNOWN = "flux_known_users";
              private static final String CHECKED = "flux_checked_users";

              // Проверка идёт медленно, чтобы не словить лимиты Telegram: один пользователь в секунду
              private static final long CHECK_INTERVAL_MS = 1000L;
              private static final long TTL_FLUX_MS = 7L * 24 * 3600 * 1000;
              private static final long TTL_PLAIN_MS = 3L * 24 * 3600 * 1000;
              private static final long RETRY_MS = 10L * 60 * 1000;
              private static final long MARK_RETRY_MS = 6L * 3600 * 1000;
              private static final int MAX_QUEUE = 5000;
              private static final int MAX_CHECKED = 20000;

              private static final Object LOCK = new Object();
              private static final FluxBadge INSTANCE = new FluxBadge();

              // Кто из людей точно пользуется FluxGram
              private static final Set<Long> known = new HashSet<>();
              // Когда пользователя проверяли в последний раз (мс)
              private static final Map<Long, Long> checked = new HashMap<>();
              // Когда пытались загрузить профиль в этой сессии (чтобы не долбить сервер повторами)
              private static final Map<Long, Long> tried = new HashMap<>();
              private static final ArrayDeque<Job> queue = new ArrayDeque<>();
              private static final Set<Long> queued = new HashSet<>();
              private static final boolean[] scanPending = new boolean[UserConfig.MAX_ACCOUNT_COUNT];

              private static boolean inited;
              private static boolean pumpScheduled;
              private static boolean refreshScheduled;
              private static boolean saveScheduled;

              private static Field usernamesField;
              private static Field usernameItemField;
              private static boolean usernamesLookedUp;

              private static final class Job {
                  final int account;
                  final long uid;

                  Job(int account, long uid) {
                      this.account = account;
                      this.uid = uid;
                  }
              }

              // ---------- проверки ----------

              public static boolean isFluxUser(String about) {
                  return about != null && about.contains(MARK);
              }

              // Свой аккаунт всегда со значком, чужие: по метке в «О себе» или по сохранённому списку
              public static boolean isFluxUser(long userId, String about) {
                  init(UserConfig.selectedAccount);
                  if (!enabled()) {
                      return false;
                  }
                  if (isSelf(userId)) {
                      return true;
                  }
                  if (isFluxUser(about)) {
                      learn(userId, true);
                      return true;
                  }
                  synchronized (LOCK) {
                      return known.contains(userId);
                  }
              }

              public static boolean isSelf(long userId) {
                  if (userId == 0) {
                      return false;
                  }
                  for (int a = 0; a < UserConfig.MAX_ACCOUNT_COUNT; a++) {
                      UserConfig uc = UserConfig.getInstance(a);
                      if (uc.isClientActivated() && uc.getClientUserId() == userId) {
                          return true;
                      }
                  }
                  return false;
              }

              public static boolean isOfficialChannel(TLRPC.Chat chat) {
                  if (chat == null) {
                      return false;
                  }
                  if (chat.username != null && chat.username.equalsIgnoreCase(OFFICIAL_CHANNEL)) {
                      return true;
                  }
                  // У каналов с несколькими именами публичный адрес лежит в списке usernames
                  try {
                      synchronized (LOCK) {
                          if (!usernamesLookedUp) {
                              usernamesLookedUp = true;
                              try {
                                  usernamesField = TLRPC.Chat.class.getField("usernames");
                              } catch (Throwable ignore) {
                                  usernamesField = null;
                              }
                          }
                      }
                      if (usernamesField != null) {
                          Object list = usernamesField.get(chat);
                          if (list instanceof List) {
                              for (Object o : (List<?>) list) {
                                  if (o == null) {
                                      continue;
                                  }
                                  Field f = usernameItemField;
                                  if (f == null) {
                                      f = o.getClass().getField("username");
                                      usernameItemField = f;
                                  }
                                  Object v = f.get(o);
                                  if (v instanceof String && ((String) v).equalsIgnoreCase(OFFICIAL_CHANNEL)) {
                                      return true;
                                  }
                              }
                          }
                      }
                  } catch (Throwable ignore) {
                      // нет такого поля в этой версии Telegram
                  }
                  return false;
              }

              public static boolean enabled() {
                  return prefs().getBoolean("flux_badge", true);
              }

              // Включить или выключить значок. Выключенный значок не рисуется нигде, проверка людей приостанавливается
              public static void setEnabled(boolean on) {
                  prefs().edit().putBoolean("flux_badge", on).apply();
                  if (on) {
                      for (int a = 0; a < UserConfig.MAX_ACCOUNT_COUNT; a++) {
                          if (UserConfig.getInstance(a).isClientActivated()) {
                              scheduleScan(a);
                          }
                      }
                  }
                  scheduleRefresh();
              }

              private static SharedPreferences prefs() {
                  return ApplicationLoader.applicationContext.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              private static long now() {
                  return System.currentTimeMillis();
              }

              // ---------- значки ----------

              // Статичный вариант для списков (ImageSpan не умеет анимироваться)
              public static Drawable drawable(Context ctx) {
                  return new FluxBadgeDrawable(ctx, false, false);
              }

              // Анимированный вариант с частицами для заголовков (SimpleTextView / профиль)
              public static Drawable drawableAnimated(Context ctx) {
                  return new FluxBadgeDrawable(ctx, true, false);
              }

              public static Drawable officialDrawable(Context ctx) {
                  return new FluxBadgeDrawable(ctx, true, true);
              }

              public static void showInfo(Context ctx) {
                  Toast.makeText(ctx, "Этот пользователь использует FluxGram", Toast.LENGTH_SHORT).show();
              }

              public static CharSequence append(Context ctx, CharSequence name, boolean official) {
                  SpannableStringBuilder sb = new SpannableStringBuilder(name).append(" ￼");
                  Drawable d = new FluxBadgeDrawable(ctx, false, official);
                  sb.setSpan(new ImageSpan(d, ImageSpan.ALIGN_BASELINE),
                          sb.length() - 1, sb.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  return sb;
              }

              // Имя пользователя + значок (для списков и шапки личного чата)
              public static CharSequence wrapUser(Context ctx, CharSequence name, TLRPC.User user) {
                  if (name == null || user == null) {
                      return name;
                  }
                  init(UserConfig.selectedAccount);
                  if (!enabled()) {
                      return name;
                  }
                  if (isSelf(user.id)) {
                      return append(ctx, name, false);
                  }
                  boolean flux;
                  synchronized (LOCK) {
                      flux = known.contains(user.id);
                  }
                  if (!flux) {
                      // Пользователя ещё не проверяли: ставим в начало очереди на тихую проверку «О себе»
                      if (!user.bot && !user.deleted) {
                          enqueue(UserConfig.selectedAccount, user.id, true);
                      }
                      return name;
                  }
                  return append(ctx, name, false);
              }

              // Название канала + значок официального канала
              public static CharSequence wrapChat(Context ctx, CharSequence title, TLRPC.Chat chat) {
                  if (title == null || !isOfficialChannel(chat)) {
                      return title;
                  }
                  return append(ctx, title, true);
              }

              // ---------- обнаружение других пользователей FluxGram ----------

              // Запомнить результат проверки. flux = у человека найдена метка
              private static void learn(long uid, boolean flux) {
                  boolean changed;
                  synchronized (LOCK) {
                      changed = flux ? known.add(uid) : known.remove(uid);
                      checked.put(uid, now());
                      tried.remove(uid);
                  }
                  scheduleSave();
                  if (changed) {
                      scheduleRefresh();
                  }
              }

              private static boolean needsCheck(long uid, long t) {
                  synchronized (LOCK) {
                      Long last = checked.get(uid);
                      long ttl = known.contains(uid) ? TTL_FLUX_MS : TTL_PLAIN_MS;
                      if (last != null && t - last < ttl) {
                          return false;
                      }
                      Long tr = tried.get(uid);
                      return tr == null || t - tr > RETRY_MS;
                  }
              }

              private static void enqueue(int account, long uid, boolean front) {
                  if (uid <= 0 || isSelf(uid)) {
                      return;
                  }
                  synchronized (LOCK) {
                      if (queued.contains(uid) || queue.size() >= MAX_QUEUE || !needsCheck(uid, now())) {
                          return;
                      }
                      queued.add(uid);
                      if (front) {
                          queue.addFirst(new Job(account, uid));
                      } else {
                          queue.addLast(new Job(account, uid));
                      }
                  }
                  schedulePump(CHECK_INTERVAL_MS);
              }

              private static void schedulePump(long delay) {
                  synchronized (LOCK) {
                      if (pumpScheduled) {
                          return;
                      }
                      pumpScheduled = true;
                  }
                  AndroidUtilities.runOnUIThread(PUMP, delay);
              }

              private static final Runnable PUMP = new Runnable() {
                  @Override
                  public void run() {
                      synchronized (LOCK) {
                          pumpScheduled = false;
                      }
                      try {
                          pumpOnce();
                      } catch (Throwable t) {
                          FileLog.e(t);
                      }
                      boolean more;
                      synchronized (LOCK) {
                          more = !queue.isEmpty();
                      }
                      if (more) {
                          schedulePump(CHECK_INTERVAL_MS);
                      }
                  }
              };

              // За один «тик» делает не больше одного сетевого запроса. Профили, которые уже в памяти, обрабатываются сразу
              private static void pumpOnce() {
                  for (int guard = 0; guard < 300; guard++) {
                      Job j;
                      synchronized (LOCK) {
                          if (!enabled()) {
                              queue.clear();
                              queued.clear();
                              return;
                          }
                          j = queue.pollFirst();
                          if (j == null) {
                              return;
                          }
                          queued.remove(j.uid);
                      }
                      if (!needsCheck(j.uid, now())) {
                          continue;
                      }
                      MessagesController mc = MessagesController.getInstance(j.account);
                      TLRPC.User u = mc.getUser(j.uid);
                      if (u == null || u.bot || u.deleted) {
                          continue;
                      }
                      TLRPC.UserFull full = mc.getUserFull(j.uid);
                      if (full != null) {
                          learn(j.uid, isFluxUser(full.about));
                          continue;
                      }
                      synchronized (LOCK) {
                          tried.put(j.uid, now());
                      }
                      // Ответ придёт в didReceivedNotification (userInfoDidLoad)
                      mc.loadFullUser(u, 0, true);
                      return;
                  }
              }

              // Просмотр списков: сначала собеседники из диалогов, потом контакты
              private static void scan(int account) {
                  if (!enabled()) {
                      return;
                  }
                  UserConfig uc = UserConfig.getInstance(account);
                  if (!uc.isClientActivated()) {
                      return;
                  }
                  try {
                      ArrayList<TLRPC.Dialog> dialogs = new ArrayList<>(MessagesController.getInstance(account).getAllDialogs());
                      for (TLRPC.Dialog d : dialogs) {
                          if (d != null && DialogObject.isUserDialog(d.id)) {
                              enqueue(account, d.id, false);
                          }
                      }
                  } catch (Throwable t) {
                      FileLog.e(t);
                  }
                  try {
                      ArrayList<TLRPC.TL_contact> contacts = new ArrayList<>(ContactsController.getInstance(account).contacts);
                      for (TLRPC.TL_contact c : contacts) {
                          if (c != null) {
                              enqueue(account, c.user_id, false);
                          }
                      }
                  } catch (Throwable t) {
                      FileLog.e(t);
                  }
              }

              private static void scheduleScan(final int account) {
                  if (account < 0 || account >= scanPending.length) {
                      return;
                  }
                  synchronized (LOCK) {
                      if (scanPending[account]) {
                          return;
                      }
                      scanPending[account] = true;
                  }
                  AndroidUtilities.runOnUIThread(new Runnable() {
                      @Override
                      public void run() {
                          synchronized (LOCK) {
                              scanPending[account] = false;
                          }
                          try {
                              ensureSelf(account);
                              scan(account);
                          } catch (Throwable t) {
                              FileLog.e(t);
                          }
                      }
                  }, 3000);
              }

              private static void scheduleRefresh() {
                  synchronized (LOCK) {
                      if (refreshScheduled) {
                          return;
                      }
                      refreshScheduled = true;
                  }
                  AndroidUtilities.runOnUIThread(new Runnable() {
                      @Override
                      public void run() {
                          synchronized (LOCK) {
                              refreshScheduled = false;
                          }
                          try {
                              NotificationCenter.getInstance(UserConfig.selectedAccount).postNotificationName(
                                      NotificationCenter.updateInterfaces, MessagesController.UPDATE_MASK_NAME);
                          } catch (Throwable t) {
                              FileLog.e(t);
                          }
                      }
                  }, 500);
              }

              // ---------- сохранение между запусками ----------

              private static void scheduleSave() {
                  synchronized (LOCK) {
                      if (saveScheduled) {
                          return;
                      }
                      saveScheduled = true;
                  }
                  AndroidUtilities.runOnUIThread(new Runnable() {
                      @Override
                      public void run() {
                          HashSet<String> k = new HashSet<>();
                          HashSet<String> c = new HashSet<>();
                          synchronized (LOCK) {
                              saveScheduled = false;
                              for (Long l : known) {
                                  k.add(String.valueOf(l));
                              }
                              for (Map.Entry<Long, Long> e : checked.entrySet()) {
                                  if (c.size() >= MAX_CHECKED) {
                                      break;
                                  }
                                  c.add(e.getKey() + ":" + e.getValue());
                              }
                          }
                          try {
                              prefs().edit().putStringSet(KNOWN, k).putStringSet(CHECKED, c).apply();
                          } catch (Throwable t) {
                              FileLog.e(t);
                          }
                      }
                  }, 4000);
              }

              private static void load() {
                  try {
                      Set<String> savedKnown = prefs().getStringSet(KNOWN, null);
                      Set<String> savedChecked = prefs().getStringSet(CHECKED, null);
                      synchronized (LOCK) {
                          if (savedKnown != null) {
                              for (String s : savedKnown) {
                                  try {
                                      known.add(Long.parseLong(s));
                                  } catch (NumberFormatException ignore) { }
                              }
                          }
                          if (savedChecked != null) {
                              for (String s : savedChecked) {
                                  int i = s.indexOf(':');
                                  if (i > 0) {
                                      try {
                                          checked.put(Long.parseLong(s.substring(0, i)), Long.parseLong(s.substring(i + 1)));
                                      } catch (NumberFormatException ignore) { }
                                  }
                              }
                          }
                      }
                  } catch (Throwable t) {
                      FileLog.e(t);
                  }
              }

              // ---------- запуск и метка в собственном профиле ----------

              // Вызывается при старте приложения (хук в ApplicationLoader) и лениво из интерфейса. Повторные вызовы безопасны
              public static void init(int account) {
                  synchronized (LOCK) {
                      if (inited) {
                          return;
                      }
                      inited = true;
                  }
                  if (ApplicationLoader.applicationContext == null) {
                      synchronized (LOCK) {
                          inited = false;
                      }
                      return;
                  }
                  load();
                  for (int a = 0; a < UserConfig.MAX_ACCOUNT_COUNT; a++) {
                      NotificationCenter nc = NotificationCenter.getInstance(a);
                      nc.addObserver(INSTANCE, NotificationCenter.userInfoDidLoad);
                      nc.addObserver(INSTANCE, NotificationCenter.contactsDidLoad);
                      nc.addObserver(INSTANCE, NotificationCenter.dialogsNeedReload);
                      if (UserConfig.getInstance(a).isClientActivated()) {
                          scheduleScan(a);
                      }
                  }
                  ensureSelf(account);
              }

              private static void ensureSelf(int account) {
                  if (!enabled()) {
                      return;
                  }
                  UserConfig uc = UserConfig.getInstance(account);
                  if (!uc.isClientActivated()) {
                      return;
                  }
                  TLRPC.UserFull f = MessagesController.getInstance(account).getUserFull(uc.getClientUserId());
                  if (f == null) {
                      MessagesController.getInstance(account).loadFullUser(uc.getCurrentUser(), 0, true);
                  } else {
                      apply(account, f.about);
                  }
              }

              // Дописывает невидимую метку в «О себе». Не чаще раза в 6 часов, чтобы не зациклиться, если сервер её уберёт
              private static void apply(final int account, String about) {
                  if (!enabled()) {
                      return;
                  }
                  String base = about == null ? "" : about;
                  if (isFluxUser(base)) {
                      return;
                  }
                  UserConfig uc = UserConfig.getInstance(account);
                  final long uid = uc.getClientUserId();
                  String key = "flux_mark_try_" + uid;
                  long t = now();
                  if (t - prefs().getLong(key, 0L) < MARK_RETRY_MS) {
                      return;
                  }
                  int max = uc.isPremium() ? 140 : 70;
                  // Чужой текст не обрезаем: если «О себе» заполнено под завязку, метку не ставим
                  if (base.length() + MARK.length() > max) {
                      return;
                  }
                  final String newAbout = base + MARK;
                  try {
                      Class<?> cls;
                      try {
                          cls = Class.forName("org.telegram.tgnet.tl.TL_account$updateProfile");
                      } catch (ClassNotFoundException e) {
                          cls = Class.forName("org.telegram.tgnet.TLRPC$TL_account_updateProfile");
                      }
                      TLObject req = (TLObject) cls.getDeclaredConstructor().newInstance();
                      Field fAbout = cls.getField("about");
                      fAbout.set(req, newAbout);
                      Field fFlags = cls.getField("flags");
                      fFlags.setInt(req, fFlags.getInt(req) | 4);
                      prefs().edit().putLong(key, t).apply();
                      ConnectionsManager.getInstance(account).sendRequest(req, new RequestDelegate() {
                          @Override
                          public void run(final TLObject response, final TLRPC.TL_error error) {
                              if (error != null) {
                                  FileLog.e("FluxBadge: метка не записана: " + error.text);
                                  return;
                              }
                              AndroidUtilities.runOnUIThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      try {
                                          MessagesController mc = MessagesController.getInstance(account);
                                          if (response instanceof TLRPC.User) {
                                              mc.putUser((TLRPC.User) response, false);
                                          }
                                          TLRPC.UserFull f = mc.getUserFull(uid);
                                          if (f != null) {
                                              f.about = newAbout;
                                          }
                                      } catch (Throwable e) {
                                          FileLog.e(e);
                                      }
                                  }
                              });
                          }
                      });
                  } catch (Throwable e) {
                      FileLog.e(e);
                  }
              }

              @Override
              public void didReceivedNotification(int id, int account, Object... args) {
                  if (id == NotificationCenter.userInfoDidLoad) {
                      if (args == null || args.length < 2 || !(args[0] instanceof Long) || !(args[1] instanceof TLRPC.UserFull)) {
                          return;
                      }
                      long uid = (Long) args[0];
                      String about = ((TLRPC.UserFull) args[1]).about;
                      if (uid == UserConfig.getInstance(account).getClientUserId()) {
                          apply(account, about);
                      } else {
                          learn(uid, isFluxUser(about));
                      }
                  } else if (id == NotificationCenter.contactsDidLoad || id == NotificationCenter.dialogsNeedReload) {
                      scheduleScan(account);
                  }
              }
          }
