              // Переопределение цвета ключа Telegram. null = не трогаем.
              // Свои оттенки работают на любой версии Android; «системные» только на Android 12+.
              // AMOLED работает отдельно от Material You и с любой палитрой
              public static Integer override(int key) {
                  Context c = ApplicationLoader.applicationContext;
                  if (c == null) {
                      return null;
                  }
                  Role r = table().get(key);
                  if (r == null) {
                      return null;
                  }
                  boolean my = isMaterialYou(c) && !(seedHue(c) < 0 && Build.VERSION.SDK_INT < 31);
                  boolean am = amoled(c);
                  if (!my && !am) {
                      return null;
                  }
                  boolean dark = isDark(c);
                  if (am && dark) {
                      Integer a = amoledSurface(r);
                      if (a != null && (!my || seedHue(c) < 0)) {
                          return a;
                      }
                  }
                  if (!my) {
                      return null;
                  }
                  return preview(c, r, dark);
              }

              // ===== Полное покрытие: все остальные ключи Telegram (их сотни) перекрашиваются автоматически =====
              // Берём исходный цвет текущей темы Telegram и по правилам переносим его в палитру Material You:
              //  - нейтральные серые (поверхности, текст, разделители) получают лёгкий оттенок палитры;
              //  - синие акценты (ссылки, галочки, кнопки, выделение) получают оттенок палитры;
              //  - красные, зелёные, жёлтые и т.д. (смысловые цвета) не трогаются;
              //  - яркость и прозрачность сохраняются, поэтому контраст темы не ломается.
              private static final ConcurrentHashMap<Long, Integer> TINT_CACHE = new ConcurrentHashMap<>();
              private static volatile SparseBooleanArray skipKeys;
              private static volatile float seedH = 205f;
              private static volatile float seedS = 0.5f;
              private static volatile float seedN = 0.06f;
              private static volatile long seedStamp;
              private static volatile int seedSys;

              // Ключи, которые должны остаться как есть (аватарки, обои, плеер, звонки, графики, тени, сервисные плашки поверх обоев)
              private static SparseBooleanArray skip() {
                  SparseBooleanArray s = skipKeys;
                  if (s != null) {
                      return s;
                  }
                  synchronized (FluxFeatures.class) {
                      if (skipKeys != null) {
                          return skipKeys;
                      }
                      s = new SparseBooleanArray();
                      String[] pat = {"key_avatar_", "wallpaper", "key_player_", "voipgroup", "key_calls_", "key_color_",
                              "premium", "key_stories_", "statisticchart", "shadow", "servicebackground", "servicetext",
                              "serviceicon", "servicelink", "key_chat_recording", "key_code", "key_chat_inbubbleoverlay",
                              "key_chat_outbubbleoverlay"};
                      for (Field f : Theme.class.getFields()) {
                          String n = f.getName();
                          if (!n.startsWith("key_") || f.getType() != int.class) {
                              continue;
                          }
                          String low = n.toLowerCase();
                          for (String p : pat) {
                              if (low.contains(p)) {
                                  try {
                                      s.put(f.getInt(null), true);
                                  } catch (Throwable ignore) {
                                      // поле недоступно: пропускаем
                                  }
                                  break;
                              }
                          }
                      }
                      skipKeys = s;
                      return s;
                  }
              }

              // Оттенок, насыщенность и «серая» насыщенность палитры. Для системных цветов берём обои (Android 12+)
              private static void updateSeed(Context c) {
                  int hue = seedHue(c);
                  if (hue >= 0) {
                      seedH = hue;
                      seedS = seedSat(c) / 100f;
                      seedN = Math.min(0.12f, seedS * 0.22f);
                      return;
                  }
                  long now = SystemClock.elapsedRealtime();
                  if (seedStamp != 0 && now - seedStamp < 2000) {
                      return;
                  }
                  seedStamp = now;
                  if (Build.VERSION.SDK_INT < 31) {
                      return;
                  }
                  try {
                      int p = c.getResources().getColor(android.R.color.system_accent1_500, c.getTheme());
                      int n = c.getResources().getColor(android.R.color.system_neutral1_500, c.getTheme());
                      if (p != seedSys) {
                          seedSys = p;
                          TINT_CACHE.clear();
                      }
                      float[] hsl = new float[3];
                      rgbToHsl(p, hsl);
                      seedH = hsl[0];
                      seedS = hsl[1];
                      rgbToHsl(n, hsl);
                      seedN = Math.max(0.03f, Math.min(0.12f, hsl[1]));
                  } catch (Throwable ignore) {
                      // оставляем прежнюю палитру
                  }
              }

              private static void rgbToHsl(int color, float[] out) {
                  float r = ((color >> 16) & 255) / 255f;
                  float g = ((color >> 8) & 255) / 255f;
                  float b = (color & 255) / 255f;
                  float max = Math.max(r, Math.max(g, b));
                  float min = Math.min(r, Math.min(g, b));
                  float l = (max + min) / 2f;
                  float d = max - min;
                  float h;
                  float s;
                  if (d == 0f) {
                      h = 0f;
                      s = 0f;
                  } else {
                      s = l > 0.5f ? d / (2f - max - min) : d / (max + min);
                      if (max == r) {
                          h = (g - b) / d + (g < b ? 6f : 0f);
                      } else if (max == g) {
                          h = (b - r) / d + 2f;
                      } else {
                          h = (r - g) / d + 4f;
                      }
                      h *= 60f;
                  }
                  out[0] = h;
                  out[1] = s;
                  out[2] = l;
              }

              private static int hslA(float h, float s, float l, int alpha) {
                  return (alpha << 24) | (hsl(h, s, l) & 0xFFFFFF);
              }

              private static int computeTint(int orig, int alpha, boolean dark, boolean my, boolean am) {
                  float[] hsl = new float[3];
                  rgbToHsl(orig, hsl);
                  float h = hsl[0];
                  float s = hsl[1];
                  float l = hsl[2];
                  if (s < 0.10f) {
                      // серый: поверхности, текст, разделители
                      if (l >= 0.985f || l <= 0.015f) {
                          return orig;
                      }
                      float nl = l;
                      if (am && dark && l < 0.25f) {
                          nl = l * 0.4f;
                      }
                      if (my) {
                          return hslA(seedH, seedN, nl, alpha);
                      }
                      return nl != l ? hslA(h, s, nl, alpha) : orig;
                  }
                  if (my && h >= 185f && h <= 262f) {
                      // синий акцент или синеватая поверхность тёмной темы Telegram
                      float ns = Math.min(0.92f, s * (seedS / 0.55f));
                      float nl = l;
                      if (am && dark && l < 0.25f) {
                          nl = l * 0.4f;
                      }
                      return hslA(seedH, ns, nl, alpha);
                  }
                  return orig;
              }

              // Вызывается из Theme для ключей, которых нет в таблице ролей. orig = исходный цвет темы Telegram
              public static int tint(int key, int orig) {
                  Context c = ApplicationLoader.applicationContext;
                  if (c == null) {
                      return orig;
                  }
                  boolean my = isMaterialYou(c) && !(seedHue(c) < 0 && Build.VERSION.SDK_INT < 31);
                  boolean am = amoled(c);
                  if (!my && !am) {
                      return orig;
                  }
                  if (table().get(key) != null || skip().get(key)) {
                      return orig;
                  }
                  int alpha = orig >>> 24;
                  if (alpha == 0) {
                      return orig;
                  }
                  boolean dark = isDark(c);
                  updateSeed(c);
                  long ck = ((long) key << 34) | (dark ? 1L << 33 : 0L) | (my ? 1L << 32 : 0L) | (orig & 0xFFFFFFFFL);
                  Integer cached = TINT_CACHE.get(ck);
                  if (cached != null) {
                      return cached;
                  }
                  int res = computeTint(orig, alpha, dark, my, am);
                  if (TINT_CACHE.size() > 6000) {
                      TINT_CACHE.clear();
                  }
                  TINT_CACHE.put(ck, res);
                  return res;
              }

              // Размеры скруглений M3: диалоги 28dp, карточки 16dp, поля 12dp
              public static int cornerDialog() { return AndroidUtilities.dp(28); }
              public static int cornerCard() { return AndroidUtilities.dp(16); }
              public static int cornerField() { return AndroidUtilities.dp(12); }
          }
