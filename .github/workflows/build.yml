          anchor = "timeString = org.telegram.messenger.SpyMode.decorateTime(currentMessageObject, timeString);"
          if "SpyMode.isDeleted(currentMessageObject) ? org.telegram.messenger.FluxVisual.DIM_ALPHA" in s:
              ok("ChatMessageCell: затемнение уже подключено")
          elif anchor in s:
              s = s.replace(anchor, anchor + "\n        setAlpha(org.telegram.messenger.SpyMode.isDeleted(currentMessageObject) ? org.telegram.messenger.FluxVisual.DIM_ALPHA : 1f);", 1)
              write(p, s)
              ok("ChatMessageCell: удалённые сообщения затемняются (alpha %.2f)" % 0.45)
          else:
              warn("ChatMessageCell: не нашёл строку decorateTime — затемнение удалённых сообщений не подключено")

          # ============================================================ затемнение диалога, удалённого/покинутого со стороны собеседника
          p = msg + "/SecretChatHelper.java"
          s = read(p)
          anchor2 = "if (newChat instanceof TLRPC.TL_encryptedChatDiscarded && newChat.history_deleted && !FluxVisual.keepChat()) {"
          if "FluxVisual.markRemovedDialog" in s:
              ok("SecretChatHelper: пометка удалённого диалога уже подключена")
          elif anchor2 in s:
              mark = ("if (newChat instanceof TLRPC.TL_encryptedChatDiscarded && newChat.history_deleted && FluxVisual.keepChat()) {\n"
                      "            FluxVisual.markRemovedDialog(DialogObject.makeEncryptedDialogId(newChat.id));\n"
                      "        }\n        ")
              s = s.replace(anchor2, mark + anchor2, 1)
              write(p, s)
              ok("SecretChatHelper: секретный чат, закрытый собеседником, помечен для затемнения")
          else:
              warn("SecretChatHelper: не нашёл патч «Сохранять чат» из прошлого шага, затемнение секретных чатов не подключено")

          # ============================================================ применяем затемнение в списке чатов
          cands = glob.glob(ui + "/Cells/DialogCell.java")
          if not cands:
              warn("DialogCell.java не найден, затемнение в списке чатов не подключено")
          else:
              p = cands[0]
              s = read(p)
              pat = re.compile(r'(public\s+void\s+setDialog\s*\(\s*(?:final\s+)?TLRPC\.Dialog\s+(\w+)[^)]*\)\s*\{\n)')
              if "FluxVisual.isRemovedDialog" in s:
                  ok("DialogCell: затемнение уже подключено")
              else:
                  s, n = pat.subn(lambda m: m.group(1) + "        setAlpha(org.telegram.messenger.FluxVisual.isRemovedDialog(" + m.group(2) + ".id) ? org.telegram.messenger.FluxVisual.DIM_ALPHA : 1f);\n", s)
                  if n:
                      write(p, s)
                      ok("DialogCell: диалог, удалённый/покинутый собеседником, затемняется в списке (мест: %d)" % n)
                  else:
                      warn("DialogCell: сигнатура setDialog(TLRPC.Dialog ...) не найдена, затемнение в списке чатов не подключено")

          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as f:
              f.write("## FluxGram v2: затемнение удалённого, Свободный режим, ID и номер (без звёзд/интерфейса)\n```\n" + "\n".join(report) + "\n```\n")
          PY

      - name: API ключи (необязательно, из secrets APP_ID / APP_HASH)
        env:
          S_APP_ID: ${{ secrets.APP_ID }}
          S_APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          if [ -n "$S_APP_ID" ] && [ -n "$S_APP_HASH" ]; then
            printf 'APP_ID = %s\nAPP_HASH = %s\n' "$S_APP_ID" "$S_APP_HASH" > API_KEYS
            python3 - <<'PY'
          import re, os
          p = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'(APP_ID\s*=\s*)\d+', lambda m: m.group(1) + os.environ["S_APP_ID"], s, count=1)
          s = re.sub(r'(APP_HASH\s*=\s*)"[^"]*"', lambda m: m.group(1) + '"' + os.environ["S_APP_HASH"] + '"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          print("BuildVars обновлён")
          PY
          else
            echo "Secrets APP_ID/APP_HASH не заданы — используются ключи из репозитория"
          fi

      - name: Keystore для подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p TMessagesProj/config
          # убираем случайные пробелы и переводы строк из секретов
          S_STORE_PASS=$(printf %s "$S_STORE_PASS" | tr -d '\r\n')
          S_KEY_ALIAS=$(printf %s "$S_KEY_ALIAS" | tr -d '\r\n ')
          S_KEY_PASS=$(printf %s "$S_KEY_PASS" | tr -d '\r\n')
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore
            # быстрая проверка до часовой сборки
            if ! keytool -list -keystore TMessagesProj/config/release.keystore \
                 -storepass "$S_STORE_PASS" -alias "$S_KEY_ALIAS" > /dev/null 2>&1; then
              echo "::error::keystore не открывается: неверный KEYSTORE_PASSWORD или KEY_ALIAS. Сборка остановлена, чтобы не тратить час"
              exit 1
            fi
            echo "KS_STORE_PASS=${S_STORE_PASS}" >> "$GITHUB_ENV"
            echo "KS_ALIAS=${S_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "KS_KEY_PASS=${S_KEY_PASS}" >> "$GITHUB_ENV"
            echo "Используется ваш keystore из secrets"
          else
            rm -f TMessagesProj/config/release.keystore
            keytool -genkeypair -noprompt -keystore TMessagesProj/config/release.keystore \
              -alias fluxgram -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass android123 -keypass android123 -dname "CN=FluxGram, O=FluxGram, C=US"
            echo "KS_STORE_PASS=android123" >> "$GITHUB_ENV"
            echo "KS_ALIAS=fluxgram" >> "$GITHUB_ENV"
            echo "KS_KEY_PASS=android123" >> "$GITHUB_ENV"
            echo "::warning::Создан ВРЕМЕННЫЙ keystore: APK не обновится поверх прежней версии. Задайте секреты KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
          fi

