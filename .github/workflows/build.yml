          public final class FluxFeatures {

              private static final String PREFS = "fluxgram_prefs";

              // Роли Material You 3. Системные цвета (Android 12+) или палитра из выбранного оттенка
              public enum Role {
                  PRIMARY(android.R.color.system_accent1_200, android.R.color.system_accent1_600),
                  ON_PRIMARY(android.R.color.system_accent1_800, android.R.color.system_neutral1_0),
                  PRIMARY_CONTAINER(android.R.color.system_accent1_700, android.R.color.system_accent1_100),
                  ON_PRIMARY_CONTAINER(android.R.color.system_accent1_100, android.R.color.system_accent1_900),
                  SECONDARY_CONTAINER(android.R.color.system_accent2_700, android.R.color.system_accent2_100),
                  ON_SECONDARY_CONTAINER(android.R.color.system_accent2_100, android.R.color.system_accent2_900),
                  TERTIARY(android.R.color.system_accent3_200, android.R.color.system_accent3_600),
                  TERTIARY_CONTAINER(android.R.color.system_accent3_700, android.R.color.system_accent3_100),
                  ON_TERTIARY_CONTAINER(android.R.color.system_accent3_100, android.R.color.system_accent3_900),
                  SURFACE(android.R.color.system_neutral1_900, android.R.color.system_neutral1_10),
                  SURFACE_CONTAINER(android.R.color.system_neutral1_800, android.R.color.system_neutral1_50),
                  SURFACE_CONTAINER_HIGH(android.R.color.system_neutral2_800, android.R.color.system_neutral2_100),
                  ON_SURFACE(android.R.color.system_neutral1_100, android.R.color.system_neutral1_900),
                  SURFACE_VARIANT(android.R.color.system_neutral2_800, android.R.color.system_neutral2_100),
                  ON_SURFACE_VARIANT(android.R.color.system_neutral2_200, android.R.color.system_neutral2_700),
                  OUTLINE(android.R.color.system_neutral2_400, android.R.color.system_neutral2_500);

                  final int dark;
                  final int light;

                  Role(int dark, int light) {
                      this.dark = dark;
                      this.light = light;
                  }
              }

              // Настройки лежат в кэше: override() вызывается на каждый запрос цвета, читать prefs каждый раз нельзя
              private static volatile int myState = -1;
              private static volatile int hueState = Integer.MIN_VALUE;
              private static volatile int satState = -1;
              private static volatile int amoledState = -1;
              private static SparseArray<Role> map;
              private static final ThreadLocal<Boolean> BUSY = new ThreadLocal<>();
              private static Method darkMethod;
              private static boolean darkLookedUp;

              private static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              public static boolean isMaterialYou(Context c) {
                  int st = myState;
                  if (st < 0) {
                      boolean v = prefs(c).getBoolean("material_you", FLUX_MY_DEFAULT);
                      myState = v ? 1 : 0;
                      return v;
                  }
                  return st == 1;
              }

              public static void setMaterialYou(Context c, boolean on) {
                  prefs(c).edit().putBoolean("material_you", on).apply();
                  myState = on ? 1 : 0;
                  refresh();
              }

              // Выбранный оттенок: -1 = системные динамические цвета (обои), 0..360 = палитра из оттенка
              public static int seedHue(Context c) {
                  int v = hueState;
                  if (v == Integer.MIN_VALUE) {
                      v = prefs(c).getInt("flux_seed_hue", -1);
                      hueState = v;
                  }
                  return v;
              }

              public static int seedSat(Context c) {
                  int v = satState;
                  if (v < 0) {
                      v = prefs(c).getInt("flux_seed_sat", 48);
                      satState = v;
                  }
                  return v;
              }

              // Выбор палитры сразу включает Material You, иначе выбранные цвета нигде не применились бы
              public static void setSeedQuiet(Context c, int hue, int sat) {
                  prefs(c).edit().putInt("flux_seed_hue", hue).putInt("flux_seed_sat", sat).putBoolean("material_you", true).apply();
                  hueState = hue;
                  satState = sat;
                  myState = 1;
                  TINT_CACHE.clear();
              }

              public static void setSeed(Context c, int hue, int sat) {
                  setSeedQuiet(c, hue, sat);
                  refresh();
              }

              public static boolean amoled(Context c) {
                  int st = amoledState;
                  if (st < 0) {
                      boolean v = prefs(c).getBoolean("flux_amoled", false);
                      amoledState = v ? 1 : 0;
                      return v;
                  }
                  return st == 1;
              }

              public static void setAmoled(Context c, boolean on) {
                  prefs(c).edit().putBoolean("flux_amoled", on).apply();
                  amoledState = on ? 1 : 0;
                  refresh();
              }

              // Применить изменения: сбросить кэш цветов и сообщить интерфейсу о смене темы
              public static void refresh() {
                  TINT_CACHE.clear();
                  try {
                      Theme.class.getMethod("refreshThemeColors").invoke(null);
                  } catch (Throwable ignore) {
                      // кисти обновятся по уведомлению ниже
                  }
                  try {
                      Theme.class.getMethod("invalidateTheme").invoke(null);
                  } catch (Throwable ignore) {
                      // метода нет в этой версии: достаточно уведомления ниже
                  }
                  try {
                      NotificationCenter.getGlobalInstance().postNotificationName(NotificationCenter.didSetNewTheme, false);
                  } catch (Throwable t) {
                      FileLog.e(t);
                  }
              }

              private static boolean systemDark(Context c) {
                  int mode = c.getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK;
                  return mode == Configuration.UI_MODE_NIGHT_YES;
              }

              private static synchronized Method darkMethod() {
                  if (!darkLookedUp) {
                      darkLookedUp = true;
                      try {
                          darkMethod = Theme.class.getMethod("isCurrentThemeDark");
                      } catch (Throwable ignore) {
                          darkMethod = null;
                      }
                  }
                  return darkMethod;
              }

              // Тёмная ли сейчас тема Telegram (она может отличаться от системной). Если не узнать, берём системную
              public static boolean isDark(Context c) {
                  if (Boolean.TRUE.equals(BUSY.get())) {
                      return systemDark(c);
                  }
                  BUSY.set(Boolean.TRUE);
                  try {
                      Method m = darkMethod();
                      if (m != null) {
                          Object r = m.invoke(null);
                          if (r instanceof Boolean) {
                              return (Boolean) r;
                          }
                      }
                  } catch (Throwable ignore) {
                      // тема ещё не загружена
                  } finally {
                      BUSY.set(Boolean.FALSE);
                  }
                  return systemDark(c);
              }

              private static boolean systemColors(Context c) {
                  return seedHue(c) < 0;
              }

              // Цвет роли для текущей темы. fallback: если Material You выключен
              public static int role(Context c, Role role, int fallback) {
                  if (!isMaterialYou(c)) {
                      return fallback;
                  }
                  if (systemColors(c) && Build.VERSION.SDK_INT < 31) {
                      return fallback;
                  }
                  return preview(c, role, isDark(c));
              }

              // Цвет роли независимо от переключателей (для превью в настройках)
              public static int preview(Context c, Role role, boolean dark) {
                  int hue = seedHue(c);
                  if (hue < 0) {
                      if (dark && amoled(c)) {
                          Integer a = amoledSurface(role);
                          if (a != null) {
                              return a;
                          }
                      }
                      if (Build.VERSION.SDK_INT >= 31) {
                          return c.getResources().getColor(dark ? role.dark : role.light, c.getTheme());
                      }
                      hue = 205;
                  }
                  return palette(role, dark, hue, seedSat(c) / 100f, amoled(c));
              }

              public static int systemColor(Context c, Role role, boolean dark) {
                  return c.getResources().getColor(dark ? role.dark : role.light, c.getTheme());
              }

              public static int paletteColor(Role role, boolean dark, int hue, float sat) {
                  return palette(role, dark, hue, sat, false);
              }

              // Тональная палитра из оттенка (упрощённая модель HCT на основе HSL)
              private static int palette(Role r, boolean dark, float h, float s, boolean amoled) {
                  float n = Math.min(0.12f, s * 0.22f);
                  switch (r) {
                      case PRIMARY: return hsl(h, s, dark ? 0.80f : 0.40f);
                      case ON_PRIMARY: return dark ? hsl(h, s, 0.20f) : 0xFFFFFFFF;
                      case PRIMARY_CONTAINER: return hsl(h, s * 0.9f, dark ? 0.30f : 0.90f);
                      case ON_PRIMARY_CONTAINER: return hsl(h, s, dark ? 0.90f : 0.10f);
                      case SECONDARY_CONTAINER: return hsl(h + 15, s * 0.35f, dark ? 0.30f : 0.90f);
                      case ON_SECONDARY_CONTAINER: return hsl(h + 15, s * 0.35f, dark ? 0.90f : 0.10f);
                      case TERTIARY: return hsl(h + 60, s * 0.7f, dark ? 0.80f : 0.40f);
                      case TERTIARY_CONTAINER: return hsl(h + 60, s * 0.7f, dark ? 0.30f : 0.90f);
                      case ON_TERTIARY_CONTAINER: return hsl(h + 60, s * 0.7f, dark ? 0.90f : 0.10f);
                      case SURFACE: return dark ? (amoled ? 0xFF000000 : hsl(h, n, 0.09f)) : hsl(h, n, 0.98f);
                      case SURFACE_CONTAINER: return dark ? (amoled ? hsl(h, n, 0.05f) : hsl(h, n, 0.13f)) : hsl(h, n, 0.95f);
                      case SURFACE_CONTAINER_HIGH: return dark ? (amoled ? hsl(h, n, 0.10f) : hsl(h, n, 0.18f)) : hsl(h, n, 0.92f);
                      case SURFACE_VARIANT: return dark ? (amoled ? hsl(h, n, 0.08f) : hsl(h, n, 0.17f)) : hsl(h, n, 0.90f);
                      case ON_SURFACE: return hsl(h, n, dark ? 0.90f : 0.10f);
                      case ON_SURFACE_VARIANT: return hsl(h, n, dark ? 0.78f : 0.30f);
                      default: return hsl(h, n, dark ? 0.55f : 0.45f);
                  }
              }

              // Чёрные поверхности для AMOLED (когда палитра системная или Material You выключен)
              private static Integer amoledSurface(Role r) {
                  switch (r) {
                      case SURFACE: return 0xFF000000;
                      case SURFACE_CONTAINER: return 0xFF0B0B0B;
                      case SURFACE_CONTAINER_HIGH: return 0xFF181818;
                      case SURFACE_VARIANT: return 0xFF111111;
                      default: return null;
                  }
              }

              private static int hsl(float h, float s, float l) {
                  h = ((h % 360f) + 360f) % 360f;
                  float c = (1f - Math.abs(2f * l - 1f)) * s;
                  float x = c * (1f - Math.abs((h / 60f) % 2f - 1f));
                  float m = l - c / 2f;
                  float r, g, b;
                  if (h < 60) { r = c; g = x; b = 0; }
                  else if (h < 120) { r = x; g = c; b = 0; }
                  else if (h < 180) { r = 0; g = c; b = x; }
                  else if (h < 240) { r = 0; g = x; b = c; }
                  else if (h < 300) { r = x; g = 0; b = c; }
                  else { r = c; g = 0; b = x; }
                  return 0xFF000000 | (Math.round((r + m) * 255) << 16) | (Math.round((g + m) * 255) << 8) | Math.round((b + m) * 255);
              }

