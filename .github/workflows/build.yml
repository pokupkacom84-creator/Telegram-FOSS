name: Build FluxGram

on:
  workflow_dispatch:

env:
  APP_NAME: FluxGram
  APP_PACKAGE: com.fluxgram.app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build nasm yasm make cmake perl

      - name: Rebrand to FluxGram
        run: |
          # 1. Имя пакета (applicationId) во всех build.gradle
          find . -name build.gradle -not -path "./TMessagesProj/jni/*" -print0 | xargs -0 sed -i -E \
            "s/applicationId[ =]+[\"'][^\"']*[\"']/applicationId \"$APP_PACKAGE\"/"
          # 2. Название приложения и текст "Telegram" в строках интерфейса (только текст, не имена ключей и не ссылки)
          python3 - <<'PY'
          import re, glob, os
          name = os.environ["APP_NAME"]
          pat = re.compile(r'(<string\b[^>]*>)(.*?)(</string>)', re.S)
          def fix(m):
              head, body, tail = m.groups()
              body = re.sub(r'(?<![/@.\w])Telegram(?![\w/.])', name, body)
              return head + body + tail
          count = 0
          for f in glob.glob('TMessagesProj/src/main/res/values*/strings*.xml'):
              s = open(f, encoding='utf-8').read()
              n = pat.sub(fix, s)
              if n != s:
                  open(f, 'w', encoding='utf-8').write(n)
                  count += 1
          print("changed files:", count)
          PY
          # 3. Явно задаём название приложения
          sed -i -E "s#(<string name=\"AppName(Beta)?\"[^>]*>)[^<]*#\1$APP_NAME#" TMessagesProj/src/main/res/values/strings.xml
          echo "--- проверка ---"
          grep -rn "applicationId" --include=build.gradle . | grep -v jni || true
          grep -n 'name="AppName' TMessagesProj/src/main/res/values/strings.xml || true

      - name: Add ID in profile and FluxGram settings
        run: |
          python3 - <<'PY'
          import re
          import sys

          UI = "TMessagesProj/src/main/java/org/telegram/ui/"
          P = UI + "ProfileActivity.java"
          s = open(P, encoding="utf-8").read()


          def one(name, pat, fn):
              global s
              ms = list(re.finditer(pat, s))
              if len(ms) != 1:
                  print("FAIL %s: matches=%d" % (name, len(ms)))
                  sys.exit(1)
              m = ms[0]
              s = s[:m.start()] + fn(m) + s[m.end():]
              print("ok", name)


          # 1. поля
          one("decl", r"private int languageRow;",
              lambda m: "private int languageRow;\n    private int fluxRow;\n    private int idRow;")

          # 2. сброс в updateRowsIds
          one("reset-lang", r"\n([ \t]*)languageRow = -1;",
              lambda m: m.group(0) + "\n" + m.group(1) + "fluxRow = -1;")
          one("reset-user", r"\n([ \t]*)usernameRow = -1;",
              lambda m: m.group(0) + "\n" + m.group(1) + "idRow = -1;")

          # 3. строка «FluxGram» в настройках (после «Язык»)
          one("assign-flux", r"\n([ \t]*)languageRow = rowCount\+\+;",
              lambda m: m.group(0) + "\n" + m.group(1) + "fluxRow = rowCount++;")

          # 4. строка ID в профиле пользователя (перед username)
          one("assign-id-user",
              r"\n([ \t]*)if \(user != null && username != null\) \{\s*\n\s*usernameRow = rowCount\+\+;",
              lambda m: "\n" + m.group(1) + "if (FluxSettingsActivity.showId()) {\n" + m.group(1)
              + "    idRow = rowCount++;\n" + m.group(1) + "}" + m.group(0))

          # 5. строка ID в профиле чата/канала (по возможности, осторожно)
          lines = s.split("\n")
          patched = 0
          for i in reversed(range(len(lines))):
              if not re.match(r"\s*usernameRow = rowCount\+\+;", lines[i]):
                  continue
              ind = len(lines[i]) - len(lines[i].lstrip())
              j = i - 1
              while j >= 0 and (not lines[j].strip() or (len(lines[j]) - len(lines[j].lstrip())) >= ind):
                  j -= 1
              if j < 0:
                  continue
              head = lines[j].strip()
              near = "\n".join(lines[max(0, j - 4):j + 1])
              if (head.startswith("if (") and "username" in head.lower()
                      and "user != null" not in head and "idRow = rowCount" not in near):
                  pad = lines[j][:len(lines[j]) - len(lines[j].lstrip())]
                  lines[j:j] = [pad + "if (FluxSettingsActivity.showId()) {", pad + "    idRow = rowCount++;", pad + "}"]
                  patched += 1
          s = "\n".join(lines)
          print("chat id rows patched:", patched)

          # 6. типы ячеек и кликабельность
          one("type-detail",
              r"position == phoneRow\s*\|\|\s*position == locationRow\s*\|\|\s*position == numberRow\s*\|\|\s*position == birthdayRow",
              lambda m: m.group(0) + " || position == idRow")
          one("type-text", r"position == languageRow\s*\|\|\s*position == dataRow",
              lambda m: "position == fluxRow || " + m.group(0))
          one("enabled", r"return\s+position == notificationRow\s*\|\|\s*position == numberRow",
              lambda m: "return position == idRow || position == fluxRow || position == notificationRow || position == numberRow")

          # 7. отрисовка
          one("bind-flux",
              r"\} else if \(position == languageRow\) \{\s*\n\s*textCell\.setTextAndValueAndIcon",
              lambda m: "} else if (position == fluxRow) {\n"
              "                        textCell.setTextAndIcon(\"FluxGram\", R.drawable.msg2_discussion, true);\n"
              "                    " + m.group(0))
          one("bind-id",
              r"\} else if \(position == usernameRow\) \{\s*\n\s*String username = null;",
              lambda m: "} else if (position == idRow) {\n"
              "                        detailCell.setTextAndValue(getFluxIdText(), \"ID\", true);\n"
              "                    " + m.group(0))

          # 8. нажатия
          one("click-flux",
              r"\} else if \(position == languageRow\) \{\s*\n\s*presentFragment\(new LanguageSelectActivity\(\)\);",
              lambda m: "} else if (position == fluxRow) {\n"
              "                presentFragment(new FluxSettingsActivity());\n"
              "            " + m.group(0))
          one("click-id",
              r"\} else if \(position == usernameRow\) \{\s*\n\s*processOnClickOrPress\(position, view, x, y\);",
              lambda m: "} else if (position == idRow) {\n"
              "                AndroidUtilities.addToClipboard(getFluxIdText());\n"
              "                android.widget.Toast.makeText(getParentActivity(), \"ID скопирован\", android.widget.Toast.LENGTH_SHORT).show();\n"
              "            " + m.group(0))

          # 9. метод получения ID
          one("id-method", r"private boolean processOnClickOrPress\(",
              lambda m: "private String getFluxIdText() {\n"
              "        if (userId != 0) {\n"
              "            return String.valueOf(userId);\n"
              "        }\n"
              "        if (currentChat != null && ChatObject.isChannel(currentChat)) {\n"
              "            return \"-100\" + chatId;\n"
              "        }\n"
              "        return \"-\" + chatId;\n"
              "    }\n\n"
              "    " + m.group(0))

          open(P, "w", encoding="utf-8").write(s)

          # 10. экран настроек FluxGram
          java = '''package org.telegram.ui;

          import android.content.Context;
          import android.view.View;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;

          import org.telegram.messenger.ApplicationLoader;
          import org.telegram.messenger.GhostMode;
          import org.telegram.messenger.R;
          import org.telegram.ui.ActionBar.ActionBar;
          import org.telegram.ui.ActionBar.BaseFragment;
          import org.telegram.ui.ActionBar.Theme;
          import org.telegram.ui.Cells.HeaderCell;
          import org.telegram.ui.Cells.TextCheckCell;
          import org.telegram.ui.Cells.TextInfoPrivacyCell;

          public class FluxSettingsActivity extends BaseFragment {

              private static final String PREFS = "fluxgram";
              public static final String KEY_SHOW_ID = "show_id";

              public static boolean showId() {
                  return ApplicationLoader.applicationContext
                          .getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .getBoolean(KEY_SHOW_ID, true);
              }

              private static void saveBool(String key, boolean value) {
                  ApplicationLoader.applicationContext
                          .getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .edit().putBoolean(key, value).apply();
              }

              private void addHeader(LinearLayout list, Context context, String text) {
                  HeaderCell header = new HeaderCell(context);
                  header.setText(text);
                  list.addView(header, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
              }

              private void addInfo(LinearLayout list, Context context, String text) {
                  TextInfoPrivacyCell info = new TextInfoPrivacyCell(context);
                  info.setText(text);
                  info.setBackground(Theme.getThemedDrawableByKey(context, R.drawable.greydivider, Theme.key_windowBackgroundGrayShadow));
                  list.addView(info, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
              }

              private void addToggle(LinearLayout list, Context context, String text, final String key, boolean checked, boolean divider, final boolean ghost) {
                  final TextCheckCell cell = new TextCheckCell(context);
                  cell.setBackground(Theme.getSelectorDrawable(false));
                  cell.setTextAndCheck(text, checked, divider);
                  cell.setOnClickListener(v -> {
                      boolean value = !cell.isChecked();
                      cell.setChecked(value);
                      if (ghost) {
                          GhostMode.set(key, value);
                      } else {
                          saveBool(key, value);
                      }
                  });
                  list.addView(cell, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
              }

              @Override
              public View createView(Context context) {
                  actionBar.setBackButtonImage(R.drawable.ic_ab_back);
                  actionBar.setAllowOverlayTitle(true);
                  actionBar.setTitle("FluxGram");
                  actionBar.setActionBarMenuOnItemClick(new ActionBar.ActionBarMenuOnItemClick() {
                      @Override
                      public void onItemClick(int id) {
                          if (id == -1) {
                              finishFragment();
                          }
                      }
                  });

                  ScrollView scroll = new ScrollView(context);
                  scroll.setBackgroundColor(Theme.getColor(Theme.key_windowBackgroundWhite));
                  LinearLayout list = new LinearLayout(context);
                  list.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(list, new ScrollView.LayoutParams(ScrollView.LayoutParams.MATCH_PARENT, ScrollView.LayoutParams.WRAP_CONTENT));

                  addHeader(list, context, "Режим призрака");
                  addToggle(list, context, "Режим призрака", GhostMode.KEY_ENABLED, GhostMode.isOn(), true, true);
                  addToggle(list, context, "Не читать сообщения", GhostMode.KEY_NO_READ, GhostMode.get(GhostMode.KEY_NO_READ, true), true, true);
                  addToggle(list, context, "Не читать истории", GhostMode.KEY_NO_STORIES, GhostMode.get(GhostMode.KEY_NO_STORIES, true), true, true);
                  addToggle(list, context, "Не отправлять «онлайн»", GhostMode.KEY_NO_ONLINE, GhostMode.get(GhostMode.KEY_NO_ONLINE, true), true, true);
                  addToggle(list, context, "Не отправлять «печатает»", GhostMode.KEY_NO_TYPING, GhostMode.get(GhostMode.KEY_NO_TYPING, true), true, true);
                  addToggle(list, context, "Автоматический «офлайн»", GhostMode.KEY_AUTO_OFFLINE, GhostMode.get(GhostMode.KEY_AUTO_OFFLINE, true), false, true);
                  addInfo(list, context, "Главный переключатель включает выбранные ниже опции. Каждую опцию можно отключить отдельно.");

                  addToggle(list, context, "Читать при действиях", GhostMode.KEY_READ_ON_ACTIONS, GhostMode.get(GhostMode.KEY_READ_ON_ACTIONS, true), false, true);
                  addInfo(list, context, "Автоматически читает сообщения чата при отправке нового сообщения или реакции.");

                  addHeader(list, context, "Профиль");
                  addToggle(list, context, "Показывать ID в профиле", KEY_SHOW_ID, showId(), false, false);
                  addInfo(list, context, "");

                  fragmentView = scroll;
                  return fragmentView;
              }
          }
          '''
          open(UI + "FluxSettingsActivity.java", "w", encoding="utf-8").write(java)
          print("FluxSettingsActivity.java written")
          PY

      - name: Add Ghost Mode (AyuGram-style)
        run: |
          python3 - <<'PY'
          import re
          import sys

          J = "TMessagesProj/src/main/java/org/telegram/"


          def load(p):
              return open(J + p, encoding="utf-8").read()


          def save(p, s):
              open(J + p, "w", encoding="utf-8").write(s)


          def patch(s, name, pat, fn, count=1):
              ms = list(re.finditer(pat, s))
              if len(ms) != count:
                  print("FAIL %s: matches=%d (expected %d)" % (name, len(ms), count))
                  sys.exit(1)
              for m in reversed(ms):
                  s = s[:m.start()] + fn(m) + s[m.end():]
              print("ok", name)
              return s


          # ---------------- MessagesController ----------------
          f = "messenger/MessagesController.java"
          s = load(f)

          # 1. не отправлять чтение (откладываем до действия пользователя)
          s = patch(s, "mc-complete-read",
                    r"private void completeReadTask\(ReadTask task\) \{",
                    lambda m: '''private boolean ghostBypassRead;
              private final java.util.HashMap<String, ReadTask> ghostPendingReads = new java.util.HashMap<>();

              public void flushGhostReads(final long dialogId) {
                  Utilities.stageQueue.postRunnable(() -> {
                      ArrayList<ReadTask> toSend = new ArrayList<>();
                      String prefix = dialogId + "_";
                      java.util.Iterator<java.util.Map.Entry<String, ReadTask>> it = ghostPendingReads.entrySet().iterator();
                      while (it.hasNext()) {
                          java.util.Map.Entry<String, ReadTask> e = it.next();
                          if (e.getKey().startsWith(prefix)) {
                              toSend.add(e.getValue());
                              it.remove();
                          }
                      }
                      ghostBypassRead = true;
                      try {
                          for (int i = 0; i < toSend.size(); i++) {
                              completeReadTask(toSend.get(i));
                          }
                      } finally {
                          ghostBypassRead = false;
                      }
                  });
              }

              public void ghostOnUserAction(long dialogId) {
                  if (!GhostMode.isOn()) {
                      return;
                  }
                  if (GhostMode.readOnActions()) {
                      flushGhostReads(dialogId);
                  }
                  if (GhostMode.autoOffline()) {
                      Utilities.stageQueue.postRunnable(() -> {
                          TLRPC.TL_account_updateStatus offlineReq = new TLRPC.TL_account_updateStatus();
                          offlineReq.offline = true;
                          getConnectionsManager().sendRequest(offlineReq, (response, error) -> {});
                      }, 3000);
                  }
              }

              private void completeReadTask(ReadTask task) {
                  if (!ghostBypassRead && GhostMode.blockRead()) {
                      ghostPendingReads.put(task.dialogId + "_" + task.replyId, task);
                      return;
                  }''')

          # 2. не отправлять «онлайн»
          s = patch(s, "mc-online",
                    r"if \(!ignoreSetOnline && getConnectionsManager\(\)\.getPauseTime\(\) == 0",
                    lambda m: "if (!ignoreSetOnline && !GhostMode.blockOnline() && getConnectionsManager().getPauseTime() == 0")
          s = patch(s, "mc-offline",
                    r"\} else if \(statusSettingState != 2 && !offlineSent && Math\.abs\(System\.currentTimeMillis\(\) - getConnectionsManager\(\)\.getPauseTime\(\)\) >= 2000\) \{",
                    lambda m: "} else if ((!GhostMode.blockOnline() || GhostMode.autoOffline()) && statusSettingState != 2 && !offlineSent && Math.abs(System.currentTimeMillis() - getConnectionsManager().getPauseTime()) >= 2000) {")

          # 3. не отправлять «печатает»
          s = patch(s, "mc-typing",
                    r"public boolean sendTyping\(long dialogId, long threadMsgId, int action, String emojicon, int classGuid\) \{",
                    lambda m: m.group(0) + "\n        if (GhostMode.blockTyping()) {\n            return false;\n        }")
          save(f, s)

          # ---------------- SendMessagesHelper ----------------
          f = "messenger/SendMessagesHelper.java"
          s = load(f)
          s = patch(s, "smh-send",
                    r"\n([ \t]*)long peer = sendMessageParams\.peer;",
                    lambda m: m.group(0) + "\n" + m.group(1) + "getMessagesController().ghostOnUserAction(peer);")
          s = patch(s, "smh-reaction",
                    r"public void sendReaction\(MessageObject messageObject, ArrayList<ReactionsLayoutInBubble\.VisibleReaction> visibleReactions, ReactionsLayoutInBubble\.VisibleReaction addedReaction, boolean big, boolean addToRecent, BaseFragment parentFragment, Runnable callback\) \{",
                    lambda m: m.group(0) + "\n        if (messageObject != null) {\n            getMessagesController().ghostOnUserAction(messageObject.getDialogId());\n        }")
          save(f, s)

          # ---------------- StoriesController ----------------
          f = "ui/Stories/StoriesController.java"
          s = load(f)
          s = patch(s, "st-import", r"(package [^;]+;\n)",
                    lambda m: m.group(1) + "\nimport org.telegram.messenger.GhostMode;")
          s = patch(s, "st-read",
                    r"(req\.max_id = storyItem\.id;\s*\n)([ \t]*)(ConnectionsManager\.getInstance\(currentAccount\)\.sendRequest\(req, \(response, error\) -> \{\}\);)",
                    lambda m: m.group(1) + m.group(2) + "if (!GhostMode.blockStories()) {\n" + m.group(2) + "    " + m.group(3) + "\n" + m.group(2) + "}")
          s = patch(s, "st-views",
                    r"(req\.id\.add\(storyId\);\s*\n)([ \t]*)(ConnectionsManager\.getInstance\(currentAccount\)\.sendRequest\(req, \(response, error\) -> \{\}\);)",
                    lambda m: m.group(1) + m.group(2) + "if (!GhostMode.blockStories()) {\n" + m.group(2) + "    " + m.group(3) + "\n" + m.group(2) + "}")
          save(f, s)
          print("ghost patches applied")

          java = '''package org.telegram.messenger;

          import android.content.Context;
          import android.content.SharedPreferences;

          public class GhostMode {

              private static final String PREFS = "fluxgram";

              public static final String KEY_ENABLED = "ghost_enabled";
              public static final String KEY_NO_READ = "ghost_no_read";
              public static final String KEY_NO_STORIES = "ghost_no_stories";
              public static final String KEY_NO_ONLINE = "ghost_no_online";
              public static final String KEY_NO_TYPING = "ghost_no_typing";
              public static final String KEY_AUTO_OFFLINE = "ghost_auto_offline";
              public static final String KEY_READ_ON_ACTIONS = "ghost_read_on_actions";

              private static SharedPreferences prefs() {
                  return ApplicationLoader.applicationContext.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              public static boolean get(String key, boolean def) {
                  try {
                      return prefs().getBoolean(key, def);
                  } catch (Throwable t) {
                      return def;
                  }
              }

              public static void set(String key, boolean value) {
                  prefs().edit().putBoolean(key, value).apply();
              }

              public static boolean isOn() {
                  return get(KEY_ENABLED, false);
              }

              public static boolean blockRead() {
                  return isOn() && get(KEY_NO_READ, true);
              }

              public static boolean blockStories() {
                  return isOn() && get(KEY_NO_STORIES, true);
              }

              public static boolean blockOnline() {
                  return isOn() && get(KEY_NO_ONLINE, true);
              }

              public static boolean blockTyping() {
                  return isOn() && get(KEY_NO_TYPING, true);
              }

              public static boolean autoOffline() {
                  return isOn() && get(KEY_AUTO_OFFLINE, true);
              }

              public static boolean readOnActions() {
                  return isOn() && get(KEY_READ_ON_ACTIONS, true);
              }
          }
          '''
          open(J + "messenger/GhostMode.java", "w", encoding="utf-8").write(java)
          print("GhostMode.java written")
          PY

      - name: Android SDK licenses and packages
        run: |
          set +o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1"
          NDK=$(grep -rhoE 'ndkVersion[ =]+"[0-9.]+"' --include=build.gradle . | head -1 | grep -oE '[0-9.]+' | head -1)
          [ -n "$NDK" ] && "$SDKM" "ndk;$NDK" || true

      - name: Create API_KEYS
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          printf 'APP_ID = %s\nAPP_HASH = %s\n' "${APP_ID:-12345}" "${APP_HASH:-aaaaaaaabbbbbbccccccfffffff001122}" > API_KEYS

      - name: Build native libraries (libvpx, ffmpeg, boringssl)
        run: |
          export NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | head -1)
          export NINJA_PATH=$(which ninja)
          cd TMessagesProj/jni
          chmod +x *.sh
          ./build_libvpx_clang.sh
          ./build_ffmpeg_clang.sh
          ./patch_ffmpeg.sh
          ./patch_boringssl.sh
          ./build_boringssl.sh

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FluxGram-apk
          path: "**/build/outputs/apk/**/*.apk"
