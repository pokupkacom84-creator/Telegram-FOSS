              if f.startswith(".git") or "/build/" in f or "/jni/" in f or "anydpi" in f:
                  continue
              low = os.path.basename(f).lower()
              if "monochrome" in low:
                  continue
              try:
                  size = Image.open(f).size
              except Exception:
